<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Control de Cobro</title>
<!-- Instalable en la pantalla de inicio (icono propio, sin barra del navegador) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icono-180.png">
<link rel="icon" href="icono-192.png">
<meta name="theme-color" content="#f8d967">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cobros">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#f6f5f2;          /* gris muy claro de fondo */
    --card:#ffffff;
    --ink:#1c2433;         /* navy oscuro (como Treinta) */
    --mut:#9aa1ad;
    --line:#ececec;
    --yellow:#f8d967;      /* amarillo pedido */
    --yellow2:#fdf3cf;
    --green:#1f6b4e;
    --green2:#e8f4ec;
    --mint:#2fae74;
    --amber:#f2a93b;
    --blue:#3a7bd5;--credit:#3a7bd5;
    --warn:#c9821f;--bad:#d4583e;
    --shadow:0 2px 12px rgba(28,36,51,.05);
  }
  html{background:var(--bg)}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;min-height:100vh;font-family:'Nunito',ui-rounded,'SF Pro Rounded',-apple-system,BlinkMacSystemFont,sans-serif;
    background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
  .demo{background:#fef6da;color:#8a6d12;text-align:center;font-size:11px;font-weight:700;padding:5px}
  header{position:sticky;top:0;z-index:50;background:var(--yellow);padding:16px 18px 18px}
  .htop{display:flex;justify-content:space-between;align-items:center}
  .htop h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.3px;color:var(--ink)}
  .htop .rep{background:var(--ink);border:none;color:#fff;border-radius:12px;padding:10px 17px;font-size:13px;font-weight:700;cursor:pointer}
  .daytot{margin-top:15px}
  .daytot .l{font-size:11px;color:#977c1a;text-transform:uppercase;letter-spacing:.7px;font-weight:800;display:block}
  .daytot .v{font-size:30px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.8px;margin-top:2px;display:block}
  .daysub{margin-top:4px;font-size:12.5px;color:#977c1a;font-weight:600}
  .daysub b{color:#1c2433}.daysub i{color:#8a5a12;font-style:normal}
  main{padding:16px;max-width:720px;margin:0 auto;padding-bottom:90px}
  .ruteros{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
  .rchip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:24px;padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  .rchip input{-webkit-user-select:text;user-select:text}
  .rchip.on{background:var(--green);border-color:var(--green);color:#fff}
  .rchip .tot{font-size:11px;opacity:.85;font-weight:600;margin-left:6px}
  .empty{color:var(--mut);text-align:center;padding:44px 16px;font-size:14px}
  .panelR{background:transparent;border-radius:16px}
  .prHead{padding:4px 4px 16px;display:flex;justify-content:space-between;align-items:center}
  .prHead .nm{font-size:20px;font-weight:800;letter-spacing:-.3px}
  .prHead .sub{font-size:12.5px;color:var(--mut);margin-top:2px}
  .prHead .nb{background:var(--mint);color:#fff;border:none;border-radius:12px;padding:11px 16px;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 3px 10px rgba(52,179,122,.3)}
  /* viaje cerrado: tarjeta gris discreta */
  .vcard{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
  .vcol{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;cursor:pointer}
  .vcol .vl{font-weight:800;font-size:15px}
  .vcol .vl .vsub{font-size:12px;color:var(--mut);font-weight:500;margin-top:2px}
  .vcol .vr{display:flex;align-items:center;gap:11px}
  .vcol .vm{font-weight:800;font-variant-numeric:tabular-nums;color:var(--green);font-size:16px}
  .vcol .chev{color:var(--mut);font-size:12px}
  .vstat{font-size:9.5px;font-weight:800;padding:3px 10px;border-radius:20px;text-transform:uppercase;letter-spacing:.3px}
  .vs-done{background:var(--green2);color:var(--green)}
  /* viaje ABIERTO: tarjeta destacada con borde verde y header de color */
  .vcard.abierta{border:2px solid var(--mint);box-shadow:0 6px 20px rgba(52,179,122,.18)}
  .vhead-open{background:var(--green);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
  .vhead-open .t{font-weight:800;font-size:16px}
  .vhead-open .s{font-size:12px;opacity:.85;margin-top:2px}
  .vhead-open .badge{background:rgba(255,255,255,.2);color:#fff;font-size:9.5px;font-weight:800;padding:3px 10px;border-radius:20px;text-transform:uppercase}
  .viaje{}
  .ped{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer}
  .ped:first-of-type{border-top:none}
  .ped .pn{font-weight:700}
  .ped .pm{text-align:right;font-variant-numeric:tabular-nums;font-weight:800;white-space:nowrap}
  .ped .sub{font-size:11.5px;color:var(--mut);margin-top:1px}
  .ped.prob{background:var(--yellow2)}
  .tag{font-size:9.5px;font-weight:800;padding:2px 8px;border-radius:12px;margin-left:7px}
  .t-cred{background:#e7f0fb;color:var(--credit)}.t-dev{background:var(--yellow2);color:var(--warn)}.t-canc{background:#fbe9e4;color:var(--bad)}
  .pbox{padding:14px 16px;border-top:1px solid var(--line);background:#faf8f3;display:none}
  .pbox.open{display:block}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:8px 14px;font-size:13px;font-weight:700;cursor:pointer}
  .chip.on{background:var(--green);border-color:var(--green);color:#fff}
  .ajustes{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
  .efline{margin-top:13px;display:flex;justify-content:space-between;align-items:center}
  .efline .e{font-size:13px;color:var(--mut)}.efline .e b{color:var(--green);font-size:16px;margin-left:5px}
  input{width:100%;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:11px;padding:12px 12px;font-size:16px;font-family:inherit}
  input:focus{outline:none;border-color:var(--mint)}
  input::placeholder{color:#b9c0ba}
  label.fld{display:block;font-size:10px;color:var(--mut);font-weight:700;margin:0 0 4px 1px;text-transform:uppercase;letter-spacing:.3px}
  .entrada{padding:14px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1.7fr 1fr;gap:8px}
  .anotabar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);
    padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.08);z-index:50;transition:transform .12s ease-out}
  .anotacont{font-size:12px;color:var(--mut);font-weight:800;text-align:center;margin-bottom:7px}
  .anotafila{display:grid;grid-template-columns:1fr 92px 56px;gap:7px}
  .anotafila input{padding:14px 12px;border:1.6px solid var(--line);border-radius:12px;font-size:16px;font-family:inherit;width:100%}
  .anotafila input:focus{outline:none;border-color:var(--orange,#e8770f)}
  .anotaadd{background:var(--green);color:#fff;border:none;border-radius:12px;font-size:24px;font-weight:800;cursor:pointer}
  .anotaadd:active{transform:scale(.94)}
  body.anotando{padding-bottom:210px}
  /* Barra de rutas en curso (debajo del total del día) */
  .rutasbar{background:var(--card);border-radius:16px;padding:10px 11px;display:flex;align-items:center;gap:9px;box-shadow:0 2px 10px rgba(28,36,51,.08)}
  .rutasbar .rb-ico{width:40px;height:40px;border-radius:12px;background:#e9f0fd;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .rutasbar .rb-tx{flex-shrink:0}
  .rutasbar .rb-tit{font-size:13.5px;font-weight:800;color:var(--ink);line-height:1.2;white-space:nowrap}
  .rutasbar .rb-sub{font-size:12px;font-weight:700;color:var(--blue);margin-top:3px;white-space:nowrap}
  .rutasbar .rb-sub .pt{font-size:9px;vertical-align:2px;margin-right:2px}
  .rutasbar .rb-div{width:1px;align-self:stretch;background:var(--line);flex-shrink:0}
  .rutasbar .rb-av{display:flex;gap:7px;overflow-x:auto;padding:1px 0;scrollbar-width:none}
  .rutasbar .rb-av::-webkit-scrollbar{display:none}
  .rb-p{flex-shrink:0;width:46px;cursor:pointer;background:none;border:none;padding:0;font-family:inherit;display:block}
  .rb-p .c{width:36px;height:36px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;transition:transform .1s}
  .rb-p .n{font-size:10.5px;color:var(--mut);font-weight:700;margin-top:4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rb-p:active .c{transform:scale(.9)}
  /* ===== Botón flotante (+) para crear viaje eligiendo vendedor ===== */
  .fabbg{position:fixed;inset:0;background:rgba(20,25,35,.38);backdrop-filter:blur(1.5px);
    opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:55}
  .fabbg.abierto{opacity:1;pointer-events:auto}
  /* El contenedor NO recibe toques: cerrado, el menú sigue ocupando espacio
     (invisible) encima del (+) y tapaba "Dinero recibido" y otros botones de
     la esquina derecha. Sólo el (+) y el menú abierto reciben toques. */
  .fabwrap{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:60;
    display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:none}
  .fabmenu.abierto{pointer-events:auto}
  body.anotando .fabwrap{display:none}
  .fab{width:60px;height:60px;border-radius:50%;border:none;background:#e8902a;color:#fff;flex-shrink:0;pointer-events:auto;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 7px 20px rgba(232,144,42,.45);
    transition:background .22s ease,color .22s ease,box-shadow .22s ease,transform .12s ease}
  .fab svg{transition:transform .34s cubic-bezier(.34,1.56,.64,1)}
  .fab:active{transform:scale(.9)}
  .fab.abierto{background:var(--ink);color:#fff;box-shadow:0 7px 20px rgba(28,36,51,.45)}
  .fab.abierto svg{transform:rotate(135deg)}
  .fabmenu{display:flex;flex-direction:column;align-items:flex-end;gap:9px;
    max-height:58vh;overflow-y:auto;padding:2px;pointer-events:none;scrollbar-width:none}
  .fabmenu::-webkit-scrollbar{display:none}
  .fabmenu .it{opacity:0;transform:translateY(16px) scale(.86);pointer-events:none;
    transition:opacity .16s ease,transform .26s cubic-bezier(.34,1.56,.64,1)}
  .fabmenu.abierto .it{opacity:1;transform:none;pointer-events:auto}
  .fabit{display:flex;align-items:center;gap:10px;background:var(--card);border:none;cursor:pointer;
    border-radius:30px;padding:7px 7px 7px 17px;font-family:inherit;box-shadow:0 4px 14px rgba(20,25,35,.22)}
  .fabit .nm{font-size:14.5px;font-weight:800;color:var(--ink);white-space:nowrap;max-width:46vw;
    overflow:hidden;text-overflow:ellipsis}
  .fabit .av{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:15px;font-weight:800;color:#fff}
  .fabit:active{transform:scale(.96)}
  .fabit.nuevo{background:rgba(255,255,255,.93);border:1.5px dashed var(--mut)}
  .fabit.nuevo .av{background:#eef0f3;color:var(--mut);font-size:21px;font-weight:700}
  .fabtit{font-size:11.5px;font-weight:800;color:#fff;letter-spacing:.5px;text-transform:uppercase;
    text-shadow:0 1px 6px rgba(0,0,0,.5);padding-right:6px;margin-bottom:1px}
  .btn-quitar{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;
    background:#fdeeea;color:#c2412b;border:1.5px solid #f1c3b6;border-radius:14px;padding:14px;
    font-family:inherit;font-size:15px;font-weight:800;transition:transform .1s ease,background .15s ease}
  .btn-quitar svg{width:20px;height:20px;flex-shrink:0}
  .btn-quitar:active{transform:scale(.97);background:#fbdcd2}
  /* Resumen del vendedor (viajes · pedidos · entregado), compacto */
  .resR{--rb:#fff;--rbd:var(--line);--rn:var(--ink);--rl:var(--mut);--rdiv:var(--line);--rpie:#5c6470;--rx:var(--warn);
    background:var(--rb);border:1px solid var(--rbd);border-radius:14px;margin:0 0 12px;box-shadow:var(--shadow);overflow:hidden}
  .resR .t{display:grid;grid-template-columns:1fr 1fr 1.6fr}
  .resR .c{padding:10px 6px 9px;text-align:center;min-width:0}
  .resR .c+.c{border-left:1px solid var(--rdiv)}
  .resR .n{font-size:19px;font-weight:900;letter-spacing:-.3px;color:var(--rn);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
  .resR .c:last-child .n{font-size:clamp(16px,4.9vw,19px)}
  .resR .l{font-size:9.5px;color:var(--rl);font-weight:800;text-transform:uppercase;letter-spacing:.6px;margin-top:2px}
  .resR .x{font-size:10.5px;color:var(--rx);font-weight:800;margin-top:2px}
  .resR .pie{border-top:1px solid var(--rdiv);padding:7px 10px;display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;font-size:11.5px;font-weight:700;color:var(--rpie);font-variant-numeric:tabular-nums}
  .resR .pt{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
  /* ===== Lista de vendedores (estilo chats) ===== */
  .vlista{background:var(--card);border-radius:18px;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow)}
  .vrow{display:flex;align-items:center;gap:13px;padding-left:14px;cursor:pointer;
    -webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
  .vrow:active{background:#f4f3ef}
  .vrow .av{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:21px;flex-shrink:0}
  .vrow .mid{flex:1;min-width:0;padding:13px 14px 13px 0;border-bottom:1px solid var(--line)}
  .vrow:last-child .mid{border-bottom:none}
  .vrow .l1,.vrow .l2{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .vrow .nm{font-size:17px;font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vrow .hr{font-size:12px;color:var(--mut);font-weight:700;flex-shrink:0}
  .vrow .hr.on{color:#e8902a}
  .vrow .sb{font-size:13.5px;color:#7b8391;font-weight:600;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;min-width:0}
  .vrow .sb svg{flex-shrink:0}
  .vrow .s-ruta{color:#c9821f;font-weight:800}.vrow .s-arm{color:#3a7bd5;font-weight:800}
  .nw{white-space:nowrap}
  .vrow .bd{min-width:22px;height:22px;border-radius:11px;background:#e8902a;color:#fff;font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;padding:0 6px;flex-shrink:0;margin-top:3px}
  /* Encabezado del vendedor (como el de una conversación) */
  .chathd{display:flex;align-items:center;gap:11px;margin:0 0 12px}
  .chathd .bk{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;padding:0}
  .chathd .av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:19px;flex-shrink:0}
  .chathd .tx{flex:1;min-width:0}
  .chathd .nm{font-size:19px;font-weight:900;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .chathd .sb{font-size:12.5px;font-weight:800;color:var(--mut)}
  .chathd .sb.on{color:#e8902a}.chathd .sb.arm{color:#3a7bd5}
  .chathd .cmas{width:42px;height:42px;border-radius:50%;border:none;background:#e8902a;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;box-shadow:0 4px 12px rgba(232,144,42,.35);padding:0}
  .chathd .cmas:active{transform:scale(.92)}
  .modalR{position:fixed;inset:0;background:rgba(20,25,35,.55);display:none;align-items:center;justify-content:center;z-index:100;padding:24px}
  .modalR.open{display:flex}
  .modalRcard{background:#fff;border-radius:20px;padding:22px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.3);animation:pop .2s}
  @keyframes pop{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:none}}
  .vfoot{padding:14px 16px;display:flex;gap:10px;align-items:center;border-top:1px solid var(--line);background:#faf8f3}
  .vfoot .vtot{flex:1;font-size:13px}.vfoot .vtot b{color:var(--green);font-size:17px}
  .btn{border:none;border-radius:12px;padding:12px 15px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;background:var(--green);color:#fff}
  .btn.ok{background:var(--mint);color:#fff;box-shadow:0 3px 10px rgba(52,179,122,.3)}
  .btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  /* reporte */
  .overlay{position:fixed;inset:0;background:rgba(31,42,36,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
  .overlay.open{display:flex}
  .sheet{background:var(--bg);width:100%;max-width:720px;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0}
  .shHead{position:sticky;top:0;background:var(--card);padding:18px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;z-index:2}
  .shHead h2{margin:0;font-size:19px;font-weight:800}
  .shHead .x{background:none;border:none;color:var(--mut);font-size:26px;cursor:pointer;line-height:1}
  .rday{padding:24px 16px;text-align:center;background:var(--green);color:#fff}
  .rday .l{font-size:11px;opacity:.8;text-transform:uppercase;letter-spacing:.7px;font-weight:700}
  .rday .v{font-size:36px;font-weight:800;margin-top:5px;letter-spacing:-1px}
  .rday .x2{font-size:12.5px;opacity:.85;margin-top:7px}
  .rm{padding:16px;margin:12px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .rm .mh{display:flex;justify-content:space-between;align-items:baseline}
  .rm .mn{font-size:16px;font-weight:800}
  .rm .mt{font-size:18px;font-weight:800;color:var(--green);font-variant-numeric:tabular-nums}
  .rm .det{margin-top:9px}
  .rm .dl{display:flex;justify-content:space-between;font-size:13px;padding:4px 0;color:var(--mut)}
  .rm .dl .r{font-variant-numeric:tabular-nums;font-weight:700}
  .rm .dl.cr{color:var(--credit)}.rm .dl.aj{color:var(--warn)}
  .copyb{margin:18px 16px;width:calc(100% - 32px)}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;padding:12px 20px;border-radius:24px;font-weight:700;font-size:14px;z-index:200;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 6px 20px rgba(31,42,36,.25)}
  .toast.show{opacity:1}.toast.err{background:var(--bad)}
  /* ===== Botón Enviar ruta premium ===== */
  @keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
  @keyframes halo{0%{box-shadow:0 8px 22px rgba(214,110,30,.4),0 0 0 0 rgba(245,140,50,.5)}70%{box-shadow:0 8px 22px rgba(214,110,30,.4),0 0 0 16px rgba(245,140,50,0)}100%{box-shadow:0 8px 22px rgba(214,110,30,.4),0 0 0 0 rgba(245,140,50,0)}}
  @keyframes brillo{0%{left:-60%}60%,100%{left:130%}}
  @keyframes checkpop{0%{transform:scale(.6);opacity:0}50%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
  .enviar-wrap{padding:2px 16px 18px;display:flex;justify-content:flex-start}

<script>
// ===== USUARIOS Y PERMISOS =====
// rol 'maestro' = todo · rol 'anotador' = solo anotar nombre+cantidad
// Cambiá nombres y PIN como quieras (mínimo 4 dígitos)
const USUARIOS=[
  {usuario:'cesar',  pass:'19881987', nombre:'César',  rol:'maestro'},
  {usuario:'tienda', pass:'123',      nombre:'Tienda', rol:'anotador'},
];
let sesion=null; // {nombre, rol}
function esMaestro(){return !modoLectura && sesion && sesion.rol==='maestro';}

function hacerLogin(){
  const n=(document.getElementById('loginUser').value||'').trim().toLowerCase();
  const pass=document.getElementById('loginPin').value.trim();
  const err=document.getElementById('loginErr');
  const u=USUARIOS.find(x=>x.usuario===n);
  if(!u){err.textContent='Usuario incorrecto';return;}
  if(pass!==u.pass){err.textContent='Contraseña incorrecta';document.getElementById('loginPin').value='';return;}
  sesion={nombre:u.nombre,rol:u.rol};
  try{sessionStorage.setItem('sesionCC',JSON.stringify(sesion));}catch(e){}
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('quienSoy').textContent=sesion.nombre+(esMaestro()?' (maestro)':' (anotador)');
  aplicarPermisos();
  renderRuteros();renderZona();
}
function cerrarSesion(){
  try{sessionStorage.removeItem('sesionCC');}catch(e){}
  sesion=null;location.reload();
}
// Oculta botones/funciones según rol
function aplicarPermisos(){
  const mostrar=esMaestro();
  document.querySelectorAll('.solo-maestro').forEach(el=>{el.style.display=mostrar?'':'none';});
}

// ===== Conexión a la nube (Supabase) =====
const SB_URL='https://shlolncjhfzqmcllwjrk.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNobG9sbmNqaGZ6cW1jbGx3anJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIwMzU5NjQsImV4cCI6MjA5NzYxMTk2NH0.CnXj2cX5V_XDy902rFN88PU_rMPEb5qdqHmAiyFXpvk';
const sb=supabase.createClient(SB_URL,SB_KEY);
const HOY=new Date().toLocaleDateString('en-CA'); // YYYY-MM-DD local
let modoLectura=false; // true cuando se ve un día anterior (solo mirar)
let borrados=[]; // uids de viajes eliminados (para que el merge no los reviva)
let ruterosBorrados=[]; // vendedores eliminados (misma razón: que no revivan al sincronizar)
// Suma los vendedores que vienen de la nube y a mí me faltan, sin revivir los
// que se eliminaron a propósito en este aparato.
function unirRuteros(mios, otros){
  (otros||[]).forEach(r=>{if(r&&!mios.includes(r)&&!ruterosBorrados.includes(r))mios.push(r);});
  return mios;
}
let guardando=false, guardarPend=false, _cargando=true;
let _errGuardar=''; // por qué falló el último guardado (para avisar la verdad)
let miUltimoGuardado=null, _timerGuardar=null, _autoOcupado=false, _ultimoVisto=null;

let ruteros=[];
const PALETA=['#2fae74','#3a7bd5','#d4583e','#9b59b6','#e8902a','#1ab5a5','#c2407a','#5d6d7e'];
function colorRutero(r){const i=ruteros.indexOf(r);return PALETA[i%PALETA.length];}
let viajes=[];
let selRutero=null, idv=1, idp=1;
let viajeAbierto=null; // id del viaje cerrado que se está viendo expandido
let vistaDetalle=false; // false = lista de vendedores; true = adentro de un vendedor
let _verTodasRutas=false; // barra de rutas en curso: mostrar todas o sólo 4
const esc=t=>String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
let auditoria=[];

// Guarda todo el estado del día en la nube (con anti-spam)
function dotSync(estado){
  const d=document.getElementById('syncDot'); if(!d)return;
  d.className='dot '+estado;
  d.title=estado==='ok'?'guardado':estado==='save'?'guardando…':'sin internet';
}
// Pide guardar, pero espera y agrupa cambios (evita guardar en cada tecla)
function escribiendoAhora(){
  const a=document.activeElement;
  return a&&(a.tagName==='INPUT'||a.tagName==='TEXTAREA');
}
// Une los pedidos de las dos versiones de un mismo viaje: manda la versión
// ganadora, pero se rescatan los pedidos que sólo tenía la perdedora (los que
// se borraron a propósito quedan anotados en pedBorrados y NO vuelven).
function rescatarPedidos(gana, pierde){
  const del=new Set([...(gana.pedBorrados||[]),...(pierde.pedBorrados||[])]);
  const tengo=new Set((gana.pedidos||[]).map(p=>p&&p.id));
  const extra=(pierde.pedidos||[]).filter(p=>p&&!tengo.has(p.id)&&!del.has(p.id));
  if(extra.length)gana.pedidos=(gana.pedidos||[]).concat(extra);
  if(gana.pedidos&&del.size)gana.pedidos=gana.pedidos.filter(p=>p&&!del.has(p.id));
  if(del.size)gana.pedBorrados=[...del];
  return gana;
}
// Combina los viajes de la nube con los míos (solo para ACTUALIZAR, no para guardar).
function combinarViajes(mios, nube){
  const mapa={};
  (nube||[]).forEach(v=>{if(v&&v.uid)mapa[v.uid]=v;});
  (mios||[]).forEach(v=>{
    if(!v) return;
    if(!v.uid){mapa['local_'+v.id+'_'+v.rutero]=v;return;}
    const ex=mapa[v.uid];
    if(!ex){mapa[v.uid]=v;return;}
    // REGLA 1 (candado del dinero): si en la nube el viaje ya está RECIBIDO y
    // mi copia no lo tiene recibido, gana la nube. Un viaje cobrado sólo se
    // "des-cobra" con el botón Reabrir, que marca 'modificado'.
    if(ex.cerrado && !v.cerrado && !v.modificado){mapa[v.uid]=ex;return;}
    // REGLA 1b (el mismo candado, al revés): si ESTE aparato recibió el dinero
    // y en la nube sigue en la calle, gana el recibido. Antes decidía el reloj:
    // con otro aparato adelantado, el "recibido" se perdía en silencio.
    // Sólo si en la nube lo reabrieron a propósito ('modificado') decide la marca.
    if(v.cerrado && !ex.cerrado && !ex.modificado){mapa[v.uid]=rescatarPedidos(v,ex);return;}
    // REGLA 2: gana la marca de tiempo más reciente. En EMPATE gana la nube
    // (antes ganaba lo local, aunque estuviera desactualizado).
    const tm=v.mod||0, te=ex.mod||0;
    const gana = tm>te ? v : ex, pierde = tm>te ? ex : v;
    // REGLA 3 (candado de pedidos): el que gana se queda con sus pedidos, PERO
    // rescata los que el otro tenía y él no. Así ningún pedido se pierde por
    // culpa de un reloj adelantado o de una copia vieja. Los borrados a
    // propósito quedan anotados en 'pedBorrados' y no se rescatan.
    mapa[v.uid]=rescatarPedidos(gana,pierde);
  });
  if(typeof borrados!=='undefined')borrados.forEach(u=>{delete mapa[u];});
  return Object.values(mapa);
}
// GUARDADO PRINCIPAL (simple y confiable): escribe en la nube exactamente lo
// que hay en pantalla. Sin combinar. Lo que guardás, queda.
// Se llama SOLO al tocar: Cerrar pedidos, Enviar ruta, Recibir dinero.
// GUARDADO SEGURO: nunca borra lo que no está en esta pantalla.
// 1) Lee lo que hay en la nube. 2) Combina (gana la versión más reciente de cada viaje).
// 3) Escribe el resultado. Así dos aparatos NO se pisan el trabajo.
// ===== BITÁCORA DE RESPALDOS =====
// La tabla 'dias' guarda UNA fila por día y se sobrescribe: si algo se pisa,
// no hay de dónde sacarlo. Por eso cada guardado bueno deja además una copia
// con fecha y hora en la tabla 'respaldos', que sólo crece y nunca se borra.
// Es "a prueba de fallos": si la tabla no existe o no hay internet, se anota
// en consola y ya. NUNCA interrumpe ni hace fallar el guardado normal.
async function respaldar(estado,marca,motivo){
  try{
    const{error}=await sb.from('respaldos').insert({
      fecha:HOY, creado_en:marca, motivo:motivo||'guardado',
      quien:sesion?sesion.nombre:'?', estado:estado});
    if(error)console.log('respaldo no guardado:',error.message||error);
  }catch(e){console.log('respaldo no guardado:',e&&e.message);}
}

async function guardarAhora(motivo){
  if(modoLectura)return true;
  dotSync('save');
  _errGuardar='';
  try{
    // 1) Traer lo último de la nube ANTES de escribir
    let nube=null;
    try{
      const{data,error}=await sb.from('dias').select('estado').eq('fecha',HOY).maybeSingle();
      if(error)throw error;
      nube=data?data.estado:null;
    }catch(le){
      // Si no se pudo leer, NO escribimos: escribir a ciegas podría borrar trabajo ajeno
      _errGuardar='sin conexión con la nube';
      dotSync('off');console.log('guardar: no se pudo leer la nube:',le.message||le);
      return false;
    }
    // 2) Combinar con lo local (sin perder nada de ningún lado)
    let viajesFinal=viajes;
    let ruterosFinal=ruteros.slice();
    let auditFinal=auditoria.slice();
    if(nube){
      unirRuteros(ruterosFinal, nube.ruteros);
      viajesFinal=combinarViajes(viajes, nube.viajes||[]);
      const claves=new Set(auditFinal.map(a=>a.hora+'|'+a.accion+'|'+(a.detalle||'')));
      (nube.auditoria||[]).forEach(a=>{const k=a.hora+'|'+a.accion+'|'+(a.detalle||'');if(!claves.has(k))auditFinal.push(a);});
      auditFinal.sort((a,b)=>new Date(b.hora)-new Date(a.hora));
    }
    // Si un vendedor que mandé a eliminar aparece con viajes (otro aparato se
    // los anotó mientras tanto), NO se elimina: se devuelve a la lista.
    ruterosBorrados.slice().forEach(r=>{
      if(viajesFinal.some(v=>v&&v.rutero===r)){
        ruterosBorrados=ruterosBorrados.filter(x=>x!==r);
        if(!ruterosFinal.includes(r))ruterosFinal.push(r);
      }
    });
    // Dejar la memoria local igual a lo combinado (para que la pantalla no quede desfasada)
    viajes=viajesFinal;ruteros=ruterosFinal;auditoria=auditFinal;
    // Subir solo viajes con contenido (los vacíos no se guardan)
    const viajesValidos=viajesFinal.filter(v=>v && ((v.pedidos&&v.pedidos.length>0)||v.entradaLista||v.cerrado));
    // ===== RED DE SEGURIDAD: NUNCA PERDER UNA RUTA CON DINERO =====
    // Último control antes de escribir: comparo lo que voy a subir contra lo
    // que hay en la nube. Si algún viaje que ya salió o ya se cobró dejaría
    // de existir, lo devuelvo tal cual está en la nube y sigo guardando.
    if(nube){
      const quedan=new Set(viajesFinal.map(v=>v&&v.uid).filter(Boolean));
      // Se protege todo viaje con dinero de por medio: ya salió a ruta o ya se
      // cobró. Ese NO se borra ni aunque yo lo haya mandado a quitar ("Quitar
      // viaje" sólo aparece en viajes vacíos; si en la nube ya salió o ya se
      // cobró, es que otro aparato lo movió mientras tanto).
      // Un viaje que todavía se está armando y que quité a propósito SÍ puede
      // irse aunque en la nube tenga clientes: no hay dinero en la calle.
      const perdidos=(nube.viajes||[]).filter(v=>
        v && v.uid && !quedan.has(v.uid) &&
        ((v.pedidos&&v.pedidos.length>0)||v.cerrado) &&
        !(borrados.includes(v.uid) && !v.cerrado && !v.entradaLista));
      if(perdidos.length){
        // Antes esto CANCELABA el guardado entero: una sola ruta protegida
        // trababa todo lo demás en este aparato, hasta recibir el dinero de
        // otra ruta. Ahora la ruta protegida se DEVUELVE tal cual está en la
        // nube y el resto se guarda normal. No se pierde nada y nada se traba.
        perdidos.forEach(v=>{
          borrados=borrados.filter(u=>u!==v.uid);
          viajesFinal.push(v); viajesValidos.push(v);   // viajesFinal es 'viajes'
          if(v.rutero){
            ruterosBorrados=ruterosBorrados.filter(r=>r!==v.rutero);
            if(!ruterosFinal.includes(v.rutero))ruterosFinal.push(v.rutero);
          }
        });
        console.log('guardar: ruta protegida devuelta:',perdidos.map(v=>v.rutero+'/'+v.uid).join(', '));
      }
    }
    // Limpiar TODO con JSON para evitar DataCloneError
    let estado;
    try{
      estado=JSON.parse(JSON.stringify({ruteros:ruterosFinal,viajes:viajesValidos,auditoria:auditFinal,idv,idp}));
    }catch(je){
      _errGuardar='error en los datos';try{renderZona();}catch(_){}
      dotSync('off');console.log('guardar err (limpieza):',je.message);
      toast('⚠ Error en datos, avisá a soporte',true);return false;
    }
    const marca=new Date().toISOString();
    const{error}=await sb.from('dias').upsert({fecha:HOY,estado:estado,actualizado_en:marca},{onConflict:'fecha'});
    if(error){_errGuardar='la nube no aceptó el guardado';try{renderZona();}catch(_){}dotSync('off');console.log('guardar error:',error.message||JSON.stringify(error));return false;}
    miUltimoGuardado=marca;dotSync('ok');
    respaldar(estado,marca,motivo); // copia de seguridad, sin esperarla
    renderZona();recalc();
    return true;
  }catch(e){
    dotSync('off');
    const msg=e&&e.message?e.message:JSON.stringify(e);
    _errGuardar='sin conexión con la nube';try{renderZona();}catch(_){}
    console.log('guardar err:',msg);
    return false;
  }
}
// Carga el estado del día desde la nube
async function cargarNube(){
  try{
    const{data}=await sb.from('dias').select('estado').eq('fecha',HOY).maybeSingle();
    if(data&&data.estado){
      const e=data.estado;
      ruteros=e.ruteros||[];viajes=e.viajes||[];auditoria=e.auditoria||[];idv=e.idv||1;idp=e.idp||1;
      // Descartar viajes vacíos huérfanos (sin pedidos y sin salir) que quedaron de pruebas
      viajes=viajes.filter(v=>v && ((v.pedidos&&v.pedidos.length>0)||v.entradaLista||v.cerrado));
      viajes.forEach(v=>{if(v&&!v.uid)v.uid=uid();});
    }
  }catch(e){console.log('cargar err',e);}
}


const q=n=>'Q'+Number(n||0).toLocaleString('es-GT',{minimumFractionDigits:2,maximumFractionDigits:2});
const hhmm=d=>d?new Date(d).toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit'}):'';
function duracion(a,b){if(!a||!b)return '';let m=Math.round((new Date(b)-new Date(a))/60000);if(m<1)return '<1 min';if(m<60)return m+' min';const h=Math.floor(m/60);return h+'h '+(m%60)+'min';}
let _toastT=null;
const toast=(m,e)=>{const t=document.getElementById('toast');t.textContent=m;t.className='toast show'+(e?' err':'');clearTimeout(_toastT);_toastT=setTimeout(()=>t.className='toast',e?3800:1600);};

function efectivoDe(p){
  if(p.estado==='cancelado'||p.estado==='credito')return 0;
  return Math.max(0,(p.total||0)-(p.devolucion||0)-(p.descuento||0)+(p.vuelto||0));
}
function ajusteDe(p){return (p.devolucion||0)+(p.descuento||0)+(p.vuelto||0);}
function efectivoViaje(v){let s=0;v.pedidos.forEach(p=>s+=efectivoDe(p));return s;}
function totalRutero(r){let s=0;viajes.filter(v=>v.rutero===r&&v.cerrado).forEach(v=>s+=efectivoViaje(v));return s;}

function recalc(){
  let efv=0,cred=0,diff=0,pendientes=[];
  viajes.forEach(v=>{
    if(!v.cerrado){
      // viaje no recibido: si ya salió, es pendiente de recibir
      if(v.entradaLista)pendientes.push(v);
      return; // NO suma al efectivo hasta recibir
    }
    v.pedidos.forEach(p=>{
      if(p.estado==='credito'){cred+=p.total||0;return;}
      if(p.estado==='cancelado')return;
      efv+=efectivoDe(p);diff+=ajusteDe(p);
    });
  });
  document.getElementById('tEfectivo').textContent=q(efv);
  let sub=[];
  if(cred>0)sub.push(`Crédito <b>${q(cred)}</b>`);
  if(diff>0)sub.push(`Ajustes <i>${q(diff)}</i>`);
  // Nombres de quienes quedaron a crédito (a la mano)
  const credNombres=[];
  viajes.forEach(v=>{if(v.cerrado)v.pedidos.forEach(p=>{if(p.estado==='credito')credNombres.push(p.nombre+' ('+v.rutero+') '+q(p.total));});});
  let subHtml=sub.join(' · ');
  if(credNombres.length)subHtml+=`<div style="font-size:11.5px;font-weight:600;margin-top:3px;opacity:.85;line-height:1.4">📋 ${credNombres.join(' · ')}</div>`;
  document.getElementById('daySub').innerHTML=subHtml;
  // Rutas en curso: una carita por cada viaje que salió y del que aún no se
  // recibe el dinero. Tocar una lleva directo a esa ruta (igual que antes).
  const al=document.getElementById('alerta');
  if(pendientes.length){
    const n=pendientes.length;
    const lista=_verTodasRutas?pendientes:pendientes.slice(0,6);
    const resto=n-lista.length;
    const caritas=lista.map(v=>{
      const r=v.rutero||'';
      const col=colorRutero(r);
      const ini=(r.trim()[0]||'?').toUpperCase();
      const nv=viajes.filter(x=>x.rutero===r).indexOf(v)+1;
      return `<button class="rb-p" onclick="irA('${r.replace(/'/g,"\\'")}',${v.id})" title="${esc(r)} · Viaje ${nv}">
        <div class="c" style="background:${col}22;color:${col}">${esc(ini)}</div>
        <div class="n">${esc(r)}</div></button>`;
    }).join('');
    const mas=resto>0?`<button class="rb-p" onclick="_verTodasRutas=true;recalc()" title="Ver las ${n}">
        <div class="c" style="background:#eef0f3;color:#7b8391">+${resto}</div>
        <div class="n">ver más</div></button>`:'';
    // Sólo se redibuja si cambió. Si se redibujara siempre, al tocar una carita
    // se borraría el botón que el dedo está tocando, y en iPhone eso puede
    // dejar trabados los toques siguientes hasta salir y volver a la app.
    const h=`<div class="rutasbar">
      <div class="rb-ico"><svg width="25" height="25" viewBox="0 0 24 24" fill="none"><path d="M2 6h11v9H2zM13 9h4l3 3v3h-7z" stroke="#3a7bd5" stroke-width="1.8" stroke-linejoin="round"/><circle cx="6" cy="17.5" r="1.8" stroke="#3a7bd5" stroke-width="1.8"/><circle cx="17" cy="17.5" r="1.8" stroke="#3a7bd5" stroke-width="1.8"/></svg></div>
      <div class="rb-tx"><div class="rb-tit">Rutas en curso</div>
        <div class="rb-sub"><span class="pt">●</span>${n} activa${n===1?'':'s'}</div></div>
      <div class="rb-div"></div>
      <div class="rb-av">${caritas}${mas}</div>
    </div>`;
    if(al.__h!==h){al.innerHTML=h;al.__h=h;}
    al.style.display='block';
  } else {al.style.display='none';al.__h='';_verTodasRutas=false;}
}

// ===== ELIMINAR VENDEDOR: mantener presionado el chip =====
// Sólo se puede eliminar si NO tiene ningún viaje del día. Si tiene rutas en
// curso o ya recibidas, se avisa y no se toca nada.
let _lpTimer=null, _lpFue=false, _lpXY=null;
function lpInicio(ev,r){
  if(modoLectura)return;
  _lpFue=false; _lpXY={x:ev.clientX,y:ev.clientY};
  clearTimeout(_lpTimer);
  _lpTimer=setTimeout(()=>{
    _lpFue=true;
    if(navigator.vibrate)try{navigator.vibrate(35);}catch(e){}
    pedirBorrarRutero(r);
  },600);
}
function lpMueve(ev){ // si el dedo se desliza (está haciendo scroll), no es pulsación larga
  if(!_lpXY)return;
  if(Math.abs(ev.clientX-_lpXY.x)>10||Math.abs(ev.clientY-_lpXY.y)>10)lpFin();
}
function lpFin(){clearTimeout(_lpTimer);_lpXY=null;setTimeout(()=>{_lpFue=false;},350);}

function pedirBorrarRutero(r){
  const vs=viajes.filter(v=>v&&v.rutero===r);
  const m=document.getElementById('modalRecibe');
  const body=document.getElementById('modalRecibeBody');
  if(!esMaestro()){
    body.innerHTML=`<div style="font-size:17px;font-weight:900;margin-bottom:6px">Sólo el maestro</div>
      <div style="font-size:13.5px;color:var(--mut);margin-bottom:16px;line-height:1.5">Para eliminar a <b>${esc(r)}</b> hay que entrar con el usuario maestro.</div>
      <button class="btn sec" style="width:100%;padding:13px" onclick="cerrarModalRecibe()">Entendido</button>`;
    m.classList.add('open');return;
  }
  if(vs.length){
    const enRuta=vs.filter(v=>!v.cerrado).length, recib=vs.filter(v=>v.cerrado).length;
    const det=[];
    if(enRuta)det.push('<b>'+enRuta+'</b> en curso');
    if(recib)det.push('<b>'+recib+'</b> ya recibida'+(recib===1?'':'s'));
    body.innerHTML=`<div style="font-size:17px;font-weight:900;margin-bottom:6px">No se puede eliminar</div>
      <div style="font-size:13.5px;color:var(--mut);margin-bottom:16px;line-height:1.5">
        <b>${esc(r)}</b> tiene ${vs.length} ruta${vs.length===1?'':'s'} de hoy (${det.join(' · ')}).<br>
        Primero hay que quitarle las rutas.</div>
      <button class="btn sec" style="width:100%;padding:13px" onclick="cerrarModalRecibe()">Entendido</button>`;
    m.classList.add('open');return;
  }
  body.innerHTML=`<div style="font-size:17px;font-weight:900;margin-bottom:6px">¿Eliminar a ${esc(r)}?</div>
    <div style="font-size:13.5px;color:var(--mut);margin-bottom:16px;line-height:1.5">No tiene ninguna ruta hoy, así que no se pierde nada.</div>
    <div style="display:flex;flex-direction:column;gap:10px">
      <button class="btn" style="background:var(--bad);padding:15px" onclick="borrarRutero('${r.replace(/'/g,"\\'")}')">Eliminar</button>
      <button class="btn sec" style="padding:13px" onclick="cerrarModalRecibe()">Cancelar</button>

}
async function borrarRutero(r){
  if(!esMaestro()||modoLectura)return;
  cerrarModalRecibe();
  if(viajes.some(v=>v&&v.rutero===r)){toast('Tiene rutas, no se puede',true);return;}
  ruteros=ruteros.filter(x=>x!==r);
  if(!ruterosBorrados.includes(r))ruterosBorrados.push(r);
  if(selRutero===r){selRutero=ruteros[0]||null;viajeAbierto=null;vistaDetalle=false;}
  logAudit('ELIMINÓ VENDEDOR',r);
  renderRuteros();renderZona();
  const ok=await guardarAhora('eliminó al vendedor '+r);
  toast(ok?'Vendedor eliminado ✓':'⚠ No se pudo guardar. Revisá internet',!ok);
}
function selR(r){selRutero=r;viajeAbierto=null;renderRuteros();renderZona();}
// Desplazamiento animado propio (en vez del "smooth" de Safari, que en iPhone
// a veces deja la página sin responder a los toques). Si el usuario toca la
// pantalla mientras se mueve, se detiene para no pelearle el dedo.
let _scrollAnim=0;
function scrollSuave(y,ms){
  const y0=window.pageYOffset, dy=y-y0, t0=performance.now(), id=++_scrollAnim;ms=ms||320;
  if(Math.abs(dy)<2)return;
  const paso=t=>{if(id!==_scrollAnim)return;
    const k=Math.min(1,(t-t0)/ms), e=1-Math.pow(1-k,3);
    window.scrollTo(0,y0+dy*e); if(k<1)requestAnimationFrame(paso);};
  requestAnimationFrame(paso);
}
['touchstart','wheel'].forEach(ev=>document.addEventListener(ev,()=>{_scrollAnim++;},{passive:true}));

// Ir a la ruta de un vendedor (caritas de "Rutas en curso" y aviso de pendientes).
// Se hace DESPUÉS de que termine el toque, para no redibujar debajo del dedo.
function irA(r,vid){
  setTimeout(()=>{
    abrirVendedor(r);
    setTimeout(()=>{
      const card=(vid!==undefined&&vid!==null)?document.getElementById('viaje-'+vid):null;
      if(!card){scrollSuave(0);return;}
      const hd=document.querySelector('header');
      const off=(hd?hd.getBoundingClientRect().height:0)+12;
      const y=card.getBoundingClientRect().top+window.pageYOffset-off;
      scrollSuave(Math.max(0,y));
    },70);
  },0);
}

// ===== BOTÓN FLOTANTE (+): nuevo viaje eligiendo vendedor =====
// La cruz gira hasta volverse una X y despliega los vendedores del día,
// más la opción de crear uno nuevo. Al elegir uno, arranca el viaje ahí.
let _fabAbierto=false;
function toggleFab(){_fabAbierto?cerrarFab():abrirFab();}
function abrirFab(){
  if(modoLectura)return;
  const menu=document.getElementById('fabMenu');
  const lista=ruteros.slice();
  // El de más abajo (pegado al botón) aparece primero
  const items=lista.map(r=>{
    const col=colorRutero(r);
    const ini=(r.trim()[0]||'?').toUpperCase();
    return `<div class="it"><button class="fabit" onclick="fabNuevoViaje('${r.replace(/'/g,"\\'")}')">
      <span class="nm">${esc(r)}</span><span class="av" style="background:${col}">${esc(ini)}</span></button></div>`;
  });
  items.push(`<div class="it"><button class="fabit nuevo" onclick="fabNuevoVendedor()">
    <span class="nm" style="color:var(--mut)">Nuevo vendedor</span><span class="av">+</span></button></div>`);
  if(lista.length)items.unshift(`<div class="it"><div class="fabtit">¿Para quién es el viaje?</div></div>`);
  menu.innerHTML=items.join('');
  // escalonado: de abajo hacia arriba
  const its=[...menu.querySelectorAll('.it')];
  its.forEach((el,i)=>{el.style.transitionDelay=((its.length-1-i)*34)+'ms';});
  menu.classList.add('abierto');
  document.getElementById('fab').classList.add('abierto');
  document.getElementById('fabBg').classList.add('abierto');
  _fabAbierto=true;
}
function cerrarFab(){
  const menu=document.getElementById('fabMenu');if(!menu)return;
  [...menu.querySelectorAll('.it')].forEach(el=>{el.style.transitionDelay='0ms';});
  menu.classList.remove('abierto');
  document.getElementById('fab').classList.remove('abierto');
  document.getElementById('fabBg').classList.remove('abierto');
  _fabAbierto=false;
}
function fabNuevoViaje(r){

  abrirVendedor(r);

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
// Marca un viaje como cambiado. La marca nunca retrocede: si otro aparato con
// el reloj adelantado ya le puso una marca "del futuro", este cambio queda
// igual por encima (+1). Así gana el último cambio de verdad, no el reloj.
function tocar(v){if(v)v.mod=Math.max(Date.now(),(v.mod||0)+1);}
// ===== IDs ÚNICOS ENTRE APARATOS =====
// Antes los id salían de un contador (idv/idp) que cada aparato cargaba de la
// nube. Con dos celulares y la PC abiertos, los tres iban en el mismo número y
// creaban viajes/pedidos DISTINTOS con el MISMO id. Como todo el código busca
// por id (find, filter, getElementById), se cruzaban: recibías un viaje y se
// cerraba otro, anotabas en la PC y el pedido caía en otra tarjeta, y "Quitar
// viaje" borraba los dos de un solo golpe.
// Ahora el id lleva la hora exacta + una marca al azar propia de este aparato,
// así dos aparatos NUNCA generan el mismo número.
const DEV=Math.floor(Math.random()*1000);
let _lastId=0;
function nuevoId(){let n=Date.now()*1000+DEV;if(n<=_lastId)n=_lastId+1;_lastId=n;return n;}
function nuevoViaje(){if(modoLectura)return;if(!selRutero)return;const v={id:nuevoId(),uid:uid(),rutero:selRutero,pedidos:[],cerrado:false,envases:'',envOk:false,entradaLista:false,pedidosListos:false};viajes.push(v);renderZona();
  setTimeout(()=>{
    const card=document.getElementById('viaje-'+v.id);
    if(card)card.scrollIntoView({behavior:'smooth',block:'center'});
    const el=document.getElementById('in-nom-'+v.id);if(el)el.focus();
  },80);}
let _enviando=false;
async function terminarPedidos(vid){if(modoLectura)return;const v=viajes.find(x=>x.id===vid);if(!v)return;
  if(_enviando)return; _enviando=true;
  const elN=document.getElementById('in-nom-'+vid), elM=document.getElementById('in-mon-'+vid);
  if(elN&&elM&&(elN.value||'').trim()&&!isNaN(parseFloat(elM.value))){
    v.pedidos.push({id:nuevoId(),nombre:elN.value.trim(),total:parseFloat(elM.value),estado:'pagado',devolucion:0,descuento:0,vuelto:0});
  }
  if(v.pedidos.length===0){toast('Agregá al menos un pedido',true);_enviando=false;return;}
  const elE=document.getElementById('env-'+vid);if(elE)v.envases=elE.value;
  v.entradaLista=true;v.horaSalida=new Date().toISOString();tocar(v);
  renderZona();
  const ok=await guardarAhora('ruta enviada');
  toast(ok?'Ruta enviada y guardada ✓':'⚠ No se pudo guardar. Revisá internet',!ok);
  _enviando=false;}
async function terminarAnotar(vid){if(modoLectura)return;const v=viajes.find(x=>x.id===vid);if(!v)return;
  const elN=document.getElementById('in-nom-'+vid), elM=document.getElementById('in-mon-'+vid);
  if(elN&&elM&&(elN.value||'').trim()&&!isNaN(parseFloat(elM.value))){
    v.pedidos.push({id:nuevoId(),nombre:elN.value.trim(),total:parseFloat(elM.value),estado:'pagado',devolucion:0,descuento:0,vuelto:0});
  }
  if(v.pedidos.length===0){toast('Agregá al menos un pedido',true);return;}
  v.pedidosListos=true;tocar(v);renderZona();
  // Preguntar por envases en el mismo toque (si ya se anotaron, no se repite)
  if(!(v.envases||'').trim())preguntarEnvases(vid);
  const ok=await guardarAhora('pedidos cerrados');
  toast(ok?'Pedidos guardados ✓':'⚠ No se pudo guardar. Revisá internet',!ok);}

// ===== ¿LLEVA ENVASES? =====
// Al cerrar pedidos se pregunta. "No" sigue directo a Enviar ruta.
// "Sí" cambia el cuadro a un campo con el teclado ya abierto.

function guardarEnvases(vid){

async function recibirTodo(vid){
  if(!esMaestro()){toast('Sólo el maestro puede recibir dinero',true);return;}
  const v=viajes.find(x=>x.id===vid);
  if(!v){toast('No encontré esa ruta. Tocá 🔄 y probá de nuevo',true);return;}
  if(v.pedidos.length===0){toast('Sin pedidos',true);return;}
  // Evitar toque accidental: si el viaje salió hace menos de 1.5s, ignorar.
  // Sólo cuenta si la salida es de HACE poco. Si la ruta la mandó otro aparato
  // con el reloj adelantado, la resta da negativa: eso NO debe bloquear.
  if(v.horaSalida){const d=Date.now()-new Date(v.horaSalida).getTime();if(d>=0&&d<1500)return;}
  if((v.envases||'').trim()&&!v.envOk){preguntarEnvOk(vid);return;}
  // Preguntar quién recibió el dinero (Lesli o César)
  mostrarQuienRecibio(vid);
}

async function confirmarRecibido(vid,quien){
  const v0=viajes.find(x=>x.id===vid);
  if(!v0){cerrarModalRecibe();toast('No encontré esa ruta. Tocá 🔄 y probá de nuevo',true);return;}
  const u=v0.uid;               // tras sincronizar el objeto puede cambiar: se sigue por uid
  const hora=new Date().toISOString();
  const marcar=v=>{
    (v.pedidos||[]).forEach(p=>{if(p.snapEf===undefined)p.snapEf=efectivoDe(p);});
    v.cerrado=true;v.horaRecibido=v.horaRecibido||hora;v.recibidoPor=quien;tocar(v);
  };
  cerrarModalRecibe();
  marcar(v0);viajeAbierto=null;renderZona();
  toast('Guardando…');
  const motivo='DINERO RECIBIDO de '+quien;
  let ok=await guardarAhora(motivo);
  if(!ok)ok=await guardarAhora(motivo);          // un reintento automático
  // Comprobar que de verdad quedó recibido. Si la sincronización lo deshizo,
  // se vuelve a marcar y se guarda otra vez antes de decir "✓".
  let v=viajes.find(x=>x.uid===u);
  if(ok && v && !v.cerrado){marcar(v);ok=await guardarAhora(motivo);v=viajes.find(x=>x.uid===u);}
  if(ok && v && v.cerrado){toast('Recibido por '+quien+' y guardado ✓');return;}
  if(v){v.cerrado=false;v.horaRecibido=null;v.recibidoPor=null;}
  renderZona();
  toast('⚠ NO se guardó ('+(_errGuardar||'no quedó recibido')+'). Volvé a tocar Recibido',true);
}

  v.cerrado=false;v.entradaLista=true;viajeAbierto=null;v.modificado=true;tocar(v);renderZona();await guardarAhora('REABRIÓ viaje');toast('⚠ Viaje reabierto — quedó registrado');}}

function borrarPedido(vid,pid){
  if(modoLectura)return;
  if(!esMaestro())return; // solo el maestro borra
  const v=viajes.find(x=>x.id===vid);if(!v)return;
  if(v.cerrado)return;
  if(v.entradaLista)return; // ruta ya enviada: primero "Corregir pedidos o envases"
  v.pedidos=v.pedidos.filter(p=>p.id!==pid);
  // Dejar constancia de que este pedido se borró A PROPÓSITO. Sin esto, la
  // fusión lo rescataría de la nube y volvería a aparecer.
  (v.pedBorrados=v.pedBorrados||[]).push(pid);
  tocar(v);
  const sy=window.scrollY;renderZona();window.scrollTo(0,sy);
  // Si el viaje ya estaba guardado en la nube (pedidos cerrados, o la ruta ya
  // había salido y se está corrigiendo), guardar de una vez. Si no, el borrado
  // queda sólo en este aparato y la nube sigue teniendo al cliente.
  if(v.pedidosListos||v.horaSalida)guardarAhora('borró un pedido');
}

let _swX0=null,_swEl=null,_swMoved=false,_swAbierto=null;

document.addEventListener('touchstart',function(e){

    if(e.target.closest('input,button,textarea,select')){_swEl=null;return;}
    const ped=e.target.closest('.ped[data-swipe]');
    if(_swAbierto && (!ped || ped!==_swAbierto))cerrarSwipe();

function pedidoSub(p){

    return orig+' · <span style="color:var(--warn)">'+parts.join(' · ')+'</span>';}
  return 'de '+q(p.total);
}

// Sube la barra de anotar justo por encima del teclado (iOS/Android)

// ===== RESUMEN DEL VENDEDOR =====
// Viajes que ya salieron (y cuántos siguen en la calle), sus pedidos, y lo
// entregado = efectivo + crédito de las rutas ya recibidas. No cuenta lo
// marcado "no se entregó" ni rutas en la calle, que aún no se confirman.
function resumenRutero(r,vs){
  const salidos=vs.filter(v=>v&&(v.entradaLista||v.cerrado));
  if(!salidos.length)return '';
  const enRuta=vs.filter(v=>v&&v.entradaLista&&!v.cerrado).length;
  const nPed=salidos.reduce((s,v)=>s+(v.pedidos||[]).length,0);
  let efv=0,cred=0;
  vs.filter(v=>v&&v.cerrado).forEach(v=>(v.pedidos||[]).forEach(p=>{
    if(p.estado==='credito')cred+=p.total||0;
    else if(p.estado!=='cancelado')efv+=efectivoDe(p);
  }));
  // Un tono suave del color del vendedor: combina con su chip y se distingue
  // de un vistazo de quién son los números.
  const c=colorRutero(r);
  return `<div class="resR" style="--rb:${c}12;--rbd:${c}40;--rl:${c};--rdiv:${c}26;--rpie:#4a5260">
    <div class="t">
      <div class="c"><div class="n">${salidos.length}</div><div class="l">Viajes</div>${enRuta?`<div class="x">${enRuta} en ruta</div>`:''}</div>
      <div class="c"><div class="n">${nPed}</div><div class="l">Pedidos</div></div>
      <div class="c"><div class="n">${q(efv+cred)}</div><div class="l">Entregado</div></div>
    </div>
    <div class="pie"><span><i class="pt" style="background:var(--mint)"></i>Efectivo ${q(efv)}</span><span><i class="pt" style="background:var(--credit)"></i>Crédito ${q(cred)}</span></div>
  </div>`;
}

// ===== LISTA DE VENDEDORES (estilo chats) =====
// Cada vendedor es una fila: su inicial en su color, el nombre y una línea con
// lo básico. Los que tienen dinero en la calle van arriba. Al tocar uno se abre
// su detalle; para volver: la flecha ‹ o deslizar a la derecha.
const ICO_CAMION_S=`<svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M2 6h11v9H2zM13 9h4l3 3v3h-7z" stroke="#e8902a" stroke-width="2" stroke-linejoin="round"/><circle cx="6" cy="17.5" r="1.8" stroke="#e8902a" stroke-width="2"/><circle cx="17" cy="17.5" r="1.8" stroke="#e8902a" stroke-width="2"/></svg>`;
const ICO_CHECK2=`<svg width="17" height="14" viewBox="0 0 26 20" fill="none"><path d="M1.5 10.5l5 5L17 5" stroke="#2fae74" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 15.5L20 5" stroke="#2fae74" stroke-width="2.4" stroke-linecap="round"/></svg>`;
const ICO_LAPIZ=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 20h4L19 9l-4-4L4 16v4Z" stroke="#3a7bd5" stroke-width="2" stroke-linejoin="round"/></svg>`;
const hCorta=iso=>iso?new Date(iso).toLocaleTimeString('es-GT',{hour:'numeric',minute:'2-digit'}):'';
function estadoVendedor(r){
  const vs=viajes.filter(v=>v&&v.rutero===r);
  const enRuta=vs.filter(v=>v.entradaLista&&!v.cerrado);
  const arm=vs.filter(v=>!v.entradaLista&&!v.cerrado);
  const rec=vs.filter(v=>v.cerrado);
  let ent=0;
  rec.forEach(v=>(v.pedidos||[]).forEach(p=>{if(p.estado==='credito')ent+=p.total||0;else if(p.estado!=='cancelado')ent+=efectivoDe(p);}));
  const t=x=>x?new Date(x).getTime():0;
  const ult=vs.reduce((m,v)=>Math.max(m,t(v.horaRecibido),t(v.horaSalida)),0);
  return {vs,enRuta,arm,rec,ent,ult};
}
function renderLista(){
  if(!ruteros.length)return '<div class="empty">Tocá <b style="color:#e8902a">+</b> para agregar un vendedor y empezar.</div>';
  const filas=ruteros.map(r=>{
    const e=estadoVendedor(r), col=colorRutero(r), j=r.replace(/'/g,"\\'");
    let sb,hr='',on=false,bd='',prio;
    if(e.enRuta.length){
      prio=0;on=true;
      hr=hCorta(e.enRuta[e.enRuta.length-1].horaSalida);
      const m=e.enRuta.reduce((s,v)=>s+efectivoViaje(v),0);
      sb=`${ICO_CAMION_S}<b class="s-ruta">En ruta</b> · ${q(m)}`;
      bd=`<span class="bd">${e.enRuta.length}</span>`;
    }else if(e.arm.length){
      prio=1;const n=e.arm.reduce((s,v)=>s+(v.pedidos||[]).length,0);
      sb=`${ICO_LAPIZ}<b class="s-arm">Armando ruta</b>${n?' · '+n+' pedido'+(n===1?'':'s'):''}`;
    }else if(e.rec.length){
      prio=2;hr=hCorta(e.rec.map(v=>v.horaRecibido).filter(Boolean).sort().pop());
      sb=`${ICO_CHECK2}${e.rec.length} viaje${e.rec.length===1?'':'s'} · ${q(e.ent)}`;
    }else{prio=3;sb='<i>Sin viajes hoy</i>';}
    return {prio,ult:e.ult,html:`<div class="vrow" onclick="if(!_lpFue)abrirVendedor('${j}')"
      onpointerdown="lpInicio(event,'${j}')" onpointerup="lpFin()" onpointerleave="lpFin()"
      onpointercancel="lpFin()" onpointermove="lpMueve(event)" oncontextmenu="return false">
      <div class="av" style="background:${col}">${esc((r.trim()[0]||'?').toUpperCase())}</div>
      <div class="mid"><div class="l1"><span class="nm">${esc(r)}</span><span class="hr${on?' on':''}">${hr}</span></div>
        <div class="l2"><span class="sb">${sb}</span>${bd}</div></div></div>`};
  }).sort((a,b)=>a.prio-b.prio||b.ult-a.ult);
  return `<div class="vlista">${filas.map(f=>f.html).join('')}</div>`;
}
function chatHeader(r){
  const e=estadoVendedor(r), col=colorRutero(r);
  let sb='';
  if(e.enRuta.length)sb=`<div class="sb on">${e.enRuta.length} ruta${e.enRuta.length===1?'':'s'} en curso</div>`;
  else if(e.arm.length)sb=`<div class="sb arm">Armando ruta</div>`;
  const mas=(!modoLectura&&!e.arm.length)?`<button class="cmas" onclick="nuevoViaje()" aria-label="Nuevo viaje"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/></svg></button>`:'';
  return `<div class="chathd"><button class="bk" onclick="volverLista()" aria-label="Volver"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 5l-7 7 7 7" stroke="#1c2433" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="av" style="background:${col}">${esc((r.trim()[0]||'?').toUpperCase())}</div>
    <div class="tx"><div class="nm">${esc(r)}</div>${sb}</div>${mas}</div>`;
}
// Abrir / volver. Se usa el historial del navegador para que el botón atrás
// (PC, Android) y el gesto de Safari también vuelvan a la lista.
function abrirVendedor(r){
  if(!ruteros.includes(r))return;
  const yaDentro=vistaDetalle;
  selRutero=r;viajeAbierto=null;vistaDetalle=true;
  try{if(yaDentro)history.replaceState({cc:'det'},'');else history.pushState({cc:'det'},'');}catch(e){}
  renderZona();window.scrollTo(0,0);
}
function volverLista(){
  if(!vistaDetalle)return;
  try{if(history.state&&history.state.cc==='det'){history.back();return;}}catch(e){}
  cerrarDetalle();
}
function cerrarDetalle(){
  if(!vistaDetalle)return;
  vistaDetalle=false;viajeAbierto=null;
  try{cerrarSwipe();}catch(e){}
  renderZona();window.scrollTo(0,0);
}
window.addEventListener('popstate',()=>{if(vistaDetalle)cerrarDetalle();});
// Deslizar a la derecha para volver (como WhatsApp). No se activa sobre el
// encabezado, ni al deslizar un cliente para borrarlo, ni mientras se anotan
// pedidos, ni con un cuadro abierto.
let _bk=null;
document.addEventListener('touchstart',e=>{
  _bk=null;
  if(!vistaDetalle||e.touches.length!==1||document.body.classList.contains('anotando'))return;
  if(e.target.closest('header,.ped[data-swipe],.anotabar,input,textarea,select,.modalR,#overlay,.fabwrap,.pbox'))return;
  if(typeof _swAbierto!=='undefined'&&_swAbierto)return;
  _bk={x:e.touches[0].clientX,y:e.touches[0].clientY,dx:0,on:false,muerto:false};
},{passive:true});
document.addEventListener('touchmove',e=>{
  if(!_bk||_bk.muerto)return;
  const dx=e.touches[0].clientX-_bk.x, dy=e.touches[0].clientY-_bk.y;
  if(!_bk.on){
    if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
    if(dx>0&&Math.abs(dx)>Math.abs(dy)*1.4)_bk.on=true;else{_bk.muerto=true;return;}
  }
  _bk.dx=Math.max(0,dx);
  const z=document.getElementById('zona');
  z.style.transition='none';z.style.transform='translateX('+_bk.dx+'px)';z.style.opacity=String(1-Math.min(.45,_bk.dx/700));
},{passive:true});
function _finBk(){
  const b=_bk;_bk=null;if(!b||!b.on)return;
  const z=document.getElementById('zona');
  z.style.transition='transform .18s ease,opacity .18s ease';
  if(b.dx>80){
    z.style.transform='translateX(100%)';z.style.opacity='0';
    setTimeout(()=>{z.style.transition='none';z.style.transform='';z.style.opacity='';volverLista();},170);
  }else{z.style.transform='';z.style.opacity='';}
}
document.addEventListener('touchend',_finBk,{passive:true});
document.addEventListener('touchcancel',_finBk,{passive:true});

function renderZona(){
  recalc();renderRuteros();
  const cont=document.getElementById('zona');
  if(vistaDetalle&&(!selRutero||!ruteros.includes(selRutero)))vistaDetalle=false;
  // LISTA de vendedores (estilo chats)
  if(!vistaDetalle){
    cont.innerHTML=renderLista();
    document.body.classList.remove('anotando');
    actualizarFab();return;
  }
  // DETALLE de un vendedor: encabezado tipo chat + resumen + viajes
  const vs=viajes.filter(v=>v.rutero===selRutero);
  let html=`<div class="panelR">${chatHeader(selRutero)}${resumenRutero(selRutero,vs)}`;
  if(vs.length===0){html+=`<div class="empty">Sin viajes todavía.<br><span style="font-size:13px">Tocá <b style="color:#e8902a">+</b> arriba para empezar uno.</span></div>`;}

  vs.forEach((v,i)=>{
    const efv=efectivoViaje(v);
    // CERRADO y no expandido -> tarjeta gris, una línea
    if(v.cerrado&&viajeAbierto!==v.id){
      const horas=v.horaSalida?`<div class="vsub" style="margin-top:1px"><span class="nw">${hCorta(v.horaSalida)} → ${hCorta(v.horaRecibido)}</span> · <span class="nw">${duracion(v.horaSalida,v.horaRecibido)}</span>${v.recibidoPor?' · <b style="color:'+(v.recibidoPor==='Lesli'?'#3a7bd5':'#2fae74')+'">'+v.recibidoPor+'</b>':''}</div>`:'';
      const marca=v.modificado?'<span class="vstat" style="background:#fdeede;color:var(--bad);margin-right:6px">⚠ modificado</span>':'';
      html+=`<div class="vcard"><div class="vcol" onclick="verViaje(${v.id})">
        <div class="vl">Viaje ${i+1}<div class="vsub">${v.pedidos.length} pedido${v.pedidos.length===1?'':'s'}${(v.envases||'').trim()?' · envase ✓':''}</div>${horas}</div>
        <div class="vr">${marca}<span class="vstat vs-done">Recibido</span><span class="vm">${q(efv)}</span><span class="chev">▸</span></div>
      </div></div>`;
      return;
    }
    // CERRADO expandido -> detalle sólo lectura
    if(v.cerrado&&viajeAbierto===v.id){
      html+=`<div class="vcard"><div class="vcol" onclick="verViaje(${v.id})">
        <div class="vl">Viaje ${i+1}<div class="vsub">${v.pedidos.length} pedido${v.pedidos.length===1?'':'s'}</div></div>
        <div class="vr"><span class="vstat vs-done">Recibido</span><span class="vm">${q(efv)}</span><span class="chev">▾</span></div></div>`;
      html+=renderPedidos(v,false);
      if(v.horaSalida)html+=`<div style="padding:11px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mut)">Salió ${hhmm(v.horaSalida)} · recibido ${hhmm(v.horaRecibido)} · duró ${duracion(v.horaSalida,v.horaRecibido)}</div>`;
      if((v.envases||'').trim())html+=`<div style="padding:13px 16px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)">Envases: ${v.envases} ${v.envOk?'<span style="color:var(--green);font-weight:700">✓ revisado</span>':''}</div>`;
      html+=`<div class="vfoot"><div class="vtot">Efectivo del viaje: <b>${q(efv)}</b></div><button class="btn sec" onclick="reabrir(${v.id})">Reabrir</button></div></div>`;
      return;
    }
    // ABIERTO -> tarjeta destacada
    const enRuta=v.entradaLista;
    html+=`<div class="vcard abierta" id="viaje-${v.id}" style="border-color:${colorRutero(selRutero)}"><div class="vhead-open" style="background:${colorRutero(selRutero)}">
      <div style="display:flex;align-items:center;gap:11px">
        <span style="width:42px;height:42px;border-radius:12px;background:rgba(255,255,255,.22);display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M2 6h11v9H2zM13 9h4l3 3v3h-7z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><circle cx="6" cy="17.5" r="1.8" stroke="#fff" stroke-width="1.8"/><circle cx="17" cy="17.5" r="1.8" stroke="#fff" stroke-width="1.8"/></svg></span>
        <div><div class="t">Viaje ${i+1}</div><div class="s">${enRuta?'En ruta · salió '+hhmm(v.horaSalida):v.pedidos.length+' pedido'+(v.pedidos.length===1?'':'s')+' · preparando'}</div></div>
      </div>
      <span class="badge">${enRuta?'En ruta':'Preparando'}</span></div>`;
    html+=renderPedidos(v,true);
    if(!v.entradaLista){
      if(!v.pedidosListos){
        // FASE 1: anotar nombres — barra fija abajo (estilo chat)
        const totAnot=v.pedidos.reduce((s,p)=>s+(p.total||0),0);
        html+=`<div style="height:10px"></div>`;
        html+=`<div class="anotabar" id="anotabar-${v.id}">
          <div class="anotacont">${v.pedidos.length} cliente(s) · ${q(totAnot)}</div>
          <div class="anotafila">
            <input id="in-nom-${v.id}" placeholder="Cliente" autocomplete="off" onfocus="reajustarVarias()" onkeydown="keyNom(event,${v.id})">
            <input id="in-mon-${v.id}" inputmode="decimal" placeholder="Q" onfocus="reajustarVarias()" onkeydown="keyMon(event,${v.id})">
            <button class="anotaadd" onclick="addPedido(${v.id})">+</button>
          </div>
          <button class="btn" style="width:100%;background:var(--ink);margin-top:9px" onclick="terminarAnotar(${v.id})">Cerrar pedidos</button>
        </div>`;
      } else if(v.pedidos.length===0){
        // FASE 2 sin clientes: no hay nada que enviar. Sólo agregar o quitar.
        html+=`<div style="padding:14px 16px 4px;border-top:1px solid var(--line)">
          <div style="font-size:13.5px;color:var(--mut);margin-bottom:12px">Este viaje se quedó sin clientes.</div>
          <button class="btn sec" style="font-size:12px;padding:8px 13px;margin-bottom:12px" onclick="volverAnotar(${v.id})">← Agregar pedidos</button>
        </div>`;
      } else {
        // FASE 2: envases y salir
        html+=`<div style="padding:14px 16px;border-top:1px solid var(--line)">
          <button class="btn sec" style="font-size:12px;padding:8px 13px;margin-bottom:12px" onclick="volverAnotar(${v.id})">← Agregar más pedidos</button>
          <label class="fld">Envases que se llevó (opcional)</label>
          <input id="env-${v.id}" placeholder="ej. 2 cajas retornable" value="${(v.envases||'').replace(/"/g,'&quot;')}" oninput="setEnvasesSilent(${v.id},this.value)"></div>
        <div class="enviar-wrap">
          <button class="btn-enviar" ontouchstart="terminarPedidos(${v.id})" onclick="terminarPedidos(${v.id})">
            <span class="ico"><svg viewBox="0 0 24 24" fill="none"><path d="M7 5h7a3 3 0 0 1 0 6H8a3 3 0 0 0 0 6h6" stroke="#e8770f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="7" cy="5" r="2.3" fill="#e8770f"/><circle cx="17" cy="17" r="2.3" fill="#e8770f"/></svg></span>
            <span class="txt"><b>Enviar ruta</b><small>Toca para confirmar la salida</small></span>
            <span class="shine"></span>
          </button>
        </div>`;
      }
    } else {
      html+=`<div style="padding:14px 16px;border-top:1px solid var(--line)">
        ${(v.envases||'').trim()?`<label class="fld">Envases que se llevó</label>
        <div style="font-size:14px;font-weight:600;margin-bottom:11px">${v.envases}</div>
        ${esMaestro()?`<div onclick="toggleEnvOk(${v.id})" style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:14px;font-weight:700">
          <span style="width:25px;height:25px;border-radius:7px;border:2px solid ${v.envOk?'var(--mint)':'var(--line)'};background:${v.envOk?'var(--mint)':'transparent'};color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900">${v.envOk?'✓':''}</span>
          Envase revisado y devuelto completo</div>`:''}`:'<div style="font-size:13px;color:var(--mut)">Sin envases registrados.</div>'}
        ${esMaestro()?`<button class="btn sec" style="font-size:12px;padding:8px 13px;margin-top:12px" onclick="reabrirEntrada(${v.id})">← Corregir pedidos o envases</button>`:''}
      </div>
      <div class="vfoot"><div class="vtot">Efectivo del viaje: <b>${q(efv)}</b></div>
        ${esMaestro()?`<button class="btn ok" id="rec-${v.id}" onclick="recibirTodo(${v.id})">Dinero recibido ✓</button>`:`<button class="btn ok" style="opacity:.45;cursor:not-allowed" disabled>Dinero recibido ✓</button>`}</div>`;
    }
    if(v.pedidos.length===0 && !v.cerrado && (!v.entradaLista || esMaestro())){
      html+=`<div style="padding:0 16px 16px"><button class="btn-quitar" onclick="borrarViaje(${v.id})">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 6.5h17"/><path d="M9 6.5V4.8c0-.7.6-1.3 1.3-1.3h3.4c.7 0 1.3.6 1.3 1.3v1.7"/><path d="M18.5 6.5l-.8 12.2a2 2 0 0 1-2 1.8H8.3a2 2 0 0 1-2-1.8L5.5 6.5"/><path d="M10 10.5v6M14 10.5v6"/></svg>
        Quitar viaje</button></div>`;

    html+=`</div>`;
  });
  html+='</div>';
  cont.innerHTML=html;

  const hayAnotando=viajes.some(v=>v.rutero===selRutero && !v.entradaLista && !v.pedidosListos && !v.cerrado);
  document.body.classList.toggle('anotando',hayAnotando);

// ---- reporte ----
function abrirReporte(){
  let efvDia=0,credDia=0;
  let h=`<div class="shHead"><h2>Reporte del día</h2><button class="x" onclick="cerrarReporte()">×</button></div>`;
  // total grande
  viajes.forEach(v=>v.pedidos.forEach(p=>{if(p.estado==='credito')credDia+=p.total||0;else if(p.estado!=='cancelado')efvDia+=efectivoDe(p);}));
  h+=`<div class="rday"><div class="l">Efectivo total recibido</div><div class="v">${q(efvDia)}</div>
    <div class="x2">${credDia>0?'Crédito del día <b>'+q(credDia)+'</b>':''}</div></div>`;
  // por muchacho
  ruteros.forEach(r=>{
    const vs=viajes.filter(v=>v.rutero===r);
    if(vs.length===0)return;
    const tot=totalRutero(r);
    const ajustes=[],creditos=[],noent=[];
    vs.forEach(v=>v.pedidos.forEach(p=>{
      if(p.estado==='credito'){creditos.push({n:p.nombre,m:p.total});return;}
      if(p.estado==='cancelado'){noent.push({n:p.nombre,m:p.total});return;}
      if(p.devolucion)ajustes.push({n:p.nombre,t:'Devolución',m:p.devolucion});
      if(p.descuento)ajustes.push({n:p.nombre,t:'Descuento',m:p.descuento});
      if(p.vuelto)ajustes.push({n:p.nombre,t:'Vuelto',m:p.vuelto});
    }));
    const col=colorRutero(r);
    h+=`<div class="rm" style="border-left:4px solid ${col}"><div class="mh"><div class="mn" style="color:${col}">${r}</div><div class="mt">${q(tot)}</div></div><div class="det">`;
    vs.filter(v=>v.cerrado&&v.horaSalida).forEach((v,k)=>{
      const idx=vs.indexOf(v)+1;
      h+=`<div class="dl"><span>Viaje ${idx}: salió ${hhmm(v.horaSalida)} → ${hhmm(v.horaRecibido)}</span><span class="r">${duracion(v.horaSalida,v.horaRecibido)}</span></div>`;
    });
    ajustes.forEach(a=>h+=`<div class="dl aj"><span>${a.n} · ${a.t}</span><span class="r">−${q(a.m)}</span></div>`);
    creditos.forEach(c=>h+=`<div class="dl cr"><span>${c.n} · crédito</span><span class="r">${q(c.m)}</span></div>`);
    noent.forEach(c=>h+=`<div class="dl" style="color:var(--bad)"><span>${c.n} · no entregó</span><span class="r">${q(c.m)}</span></div>`);
    if(!ajustes.length&&!creditos.length&&!noent.length)h+=`<div class="dl">Todo cobrado, sin novedades</div>`;
    h+=`</div></div>`;
  });
  h+=`<button class="btn copyb" onclick="copiarReporte()">Copiar para WhatsApp</button>`;
  document.getElementById('sheet').innerHTML=h;
  document.getElementById('overlay').classList.add('open');
}
function cerrarReporte(){document.getElementById('overlay').classList.remove('open');}

// ===== RECUPERACIÓN: ver los respaldos y volver a un momento anterior =====
let _respFecha=null;
function efectivoDeSnap(e){
  let s=0;(e&&e.viajes||[]).forEach(v=>(v.pedidos||[]).forEach(p=>{
    if(p.estado==='credito'||p.estado==='cancelado')return;
    s+=Math.max(0,(p.total||0)-(p.devolucion||0)-(p.descuento||0)+(p.vuelto||0));}));
  return s;
}
async function abrirRespaldos(fecha){
  if(!esMaestro()){toast('Sólo el maestro',true);return;}
  _respFecha=fecha||_respFecha||HOY;
  const sh=document.getElementById('sheet');
  sh.innerHTML=`<div class="shHead"><h2>Respaldos</h2><button class="x" onclick="cerrarReporte()">×</button></div>
    <div style="padding:4px 0 14px;color:var(--mut);font-size:13px">Buscando…</div>`;
  document.getElementById('overlay').classList.add('open');
  let filas=null,err=null;
  try{
    const{data,error}=await sb.from('respaldos').select('id,creado_en,motivo,quien,estado')
      .eq('fecha',_respFecha).order('creado_en',{ascending:false}).limit(40);
    if(error)err=error.message||String(error); else filas=data||[];
  }catch(e){err=(e&&e.message)||String(e);}

  let h=`<div class="shHead"><h2>Respaldos</h2><button class="x" onclick="cerrarReporte()">×</button></div>
    <div style="display:flex;align-items:center;gap:9px;margin-bottom:14px">
      <label class="fld" style="margin:0">Día</label>
      <input type="date" value="${_respFecha}" onchange="abrirRespaldos(this.value)" style="width:auto;padding:9px 11px">
    </div>`;
  if(err){
    h+=`<div style="background:#fbe9e4;color:var(--bad);border-radius:12px;padding:14px;font-size:13px;font-weight:600;line-height:1.5">
      No se pudo leer la bitácora.<br><span style="font-weight:400">${err}</span><br><br>
      Si dice que la tabla <b>respaldos</b> no existe, hay que crearla una sola vez en Supabase.</div>`;
  } else if(!filas.length){
    h+=`<div class="empty" style="padding:30px 10px">Todavía no hay respaldos de este día.<br><span style="font-size:12.5px">Se van creando solos cada vez que se guarda algo.</span></div>`;
  } else {
    h+=`<div style="font-size:12.5px;color:var(--mut);margin-bottom:12px;line-height:1.5">
      Cada línea es una foto completa del día en ese momento. Tocá <b>Restaurar</b> para volver a ella.<br>
      Antes de restaurar se guarda una foto de cómo está ahora, así que siempre se puede deshacer.</div>`;
    filas.forEach(f=>{
      const e=f.estado||{};
      const nv=(e.viajes||[]).length, np=(e.viajes||[]).reduce((s,v)=>s+((v.pedidos||[]).length),0);
      h+=`<div class="vcard" style="margin-bottom:9px"><div style="padding:13px 15px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
          <div style="font-weight:800;font-size:15px">${hhmm(f.creado_en)}</div>
          <div style="font-weight:800;color:var(--green);font-variant-numeric:tabular-nums">${q(efectivoDeSnap(e))}</div></div>
        <div style="font-size:12.5px;color:var(--mut);margin-top:3px">${f.motivo||'guardado'} · ${f.quien||'?'}</div>
        <div style="font-size:12px;color:var(--mut);margin-top:2px">${nv} viaje(s) · ${np} pedido(s)</div>
        <button class="btn sec" style="width:100%;margin-top:11px;font-size:13px;padding:10px"
          onclick="restaurarRespaldo(${f.id},'${hhmm(f.creado_en)}')">Restaurar este momento</button>

async function restaurarRespaldo(rid,hora){
  if(!esMaestro())return;
  if(!confirm('¿Volver el día '+_respFecha+' a como estaba a las '+hora+'?\n\nLo de ahora se guarda como respaldo, se puede deshacer.'))return;
  toast('Restaurando…');
  try{
    // 1) Foto del estado ACTUAL antes de pisarlo, para poder arrepentirse
    const{data:act}=await sb.from('dias').select('estado').eq('fecha',_respFecha).maybeSingle();
    if(act&&act.estado){
      await sb.from('respaldos').insert({fecha:_respFecha,creado_en:new Date().toISOString(),
        motivo:'ANTES DE RESTAURAR a las '+hora,quien:sesion?sesion.nombre:'?',estado:act.estado});
    }
    // 2) Traer el respaldo elegido
    const{data:snap,error:e1}=await sb.from('respaldos').select('estado').eq('id',rid).maybeSingle();
    if(e1||!snap||!snap.estado){toast('⚠ No se pudo leer el respaldo',true);return;}
    // 3) Escribir tal cual, SIN fusionar (para eso es una restauración)
    const marca=new Date().toISOString();
    const{error:e2}=await sb.from('dias').upsert({fecha:_respFecha,estado:snap.estado,actualizado_en:marca},{onConflict:'fecha'});
    if(e2){toast('⚠ No se pudo restaurar: '+(e2.message||''),true);return;}
    miUltimoGuardado=marca;
    // 4) Dejar la pantalla igual a lo restaurado
    if(_respFecha===HOY){
      const e=snap.estado;
      borrados=[];
      ruteros=e.ruteros||[];viajes=e.viajes||[];auditoria=e.auditoria||[];
      viajes.forEach(v=>{if(v&&!v.uid)v.uid=uid();});
      selRutero=(selRutero&&ruteros.includes(selRutero))?selRutero:(ruteros[0]||null);
      viajeAbierto=null;renderRuteros();renderZona();
      cerrarReporte();toast('Restaurado a las '+hora+' ✓');
    } else {
      cerrarReporte();toast('Restaurado. Miralo con el calendario 📅');
    }
  }catch(err){toast('⚠ Error al restaurar',true);console.log('restaurar:',err);}
}

function copiarReporteUnico(){

      if(p.estado==='credito'){rec='CRÉDITO';totC+=p.total;nC++;nota=` (queda a crédito ${q(p.total)})`;}
      else if(p.estado==='cancelado'){rec='NO ENTREGÓ';}
      else{rec=q(ef);totR+=ef;
        const pp=[];
        if((p.descuento||0)>0)pp.push(`desc. ${q(p.descuento)}`);
        if((p.devolucion||0)>0)pp.push(`devol. ${q(p.devolucion)}`);
        if((p.vuelto||0)>0)pp.push(`vuelto ${q(p.vuelto)}`);
        if(pp.length)nota=' ('+pp.join(', ')+')';
      }
      l+=`${p.nombre}: ${q(p.total)} → ${rec}${nota}${v.recibidoPor?' [rec: '+v.recibidoPor+']':''}\n`;}));
    if(l)t+=`*${r}*\n${l}\n`;
  });
  t+=`━━━━━━━━━━\n*TOTALES*\nOriginal (${n} pedidos): ${q(totO)}\nRecibido en efectivo: ${q(totR)}`;
  // Efectivo por encargado
  const enc={};
  viajes.forEach(v=>{if(v.cerrado&&v.recibidoPor){let e=0;v.pedidos.forEach(p=>{if(p.estado!=='credito'&&p.estado!=='cancelado')e+=efectivoDe(p);});enc[v.recibidoPor]=(enc[v.recibidoPor]||0)+e;}});
  const ek=Object.keys(enc);
  if(ek.length){t+=`\n\n*RECIBIÓ:*`;ek.forEach(k=>{t+=`\n• ${k}: ${q(enc[k])}`;});}
  if(nC>0){
    t+=`\nA crédito (${nC}): ${q(totC)}`;
    t+=`\n\n*PENDIENTES A CRÉDITO:*`;
    ruteros.forEach(r=>{const vs=viajes.filter(v=>v.rutero===r);

        if(p.estado==='credito')t+=`\n• ${p.nombre} (${r}): ${q(p.total)}`;
      }));
    });

  navigator.clipboard.writeText(t).then(()=>toast('Copiado ✓')).catch(()=>toast('No se pudo',true));
}
