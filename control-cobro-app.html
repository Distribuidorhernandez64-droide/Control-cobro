      if(p.devolucion)det.push(`  ${p.nombre}: devolución ${q(p.devolucion)}`);
      if(p.descuento)det.push(`  ${p.nombre}: descuento ${q(p.descuento)}`);
      if(p.vuelto)det.push(`  ${p.nombre}: vuelto ${q(p.vuelto)}`);
    }));
    lineas.push(`*${r}*: ${q(tot)}`+(det.length?'\n'+det.join('\n'):''));
  });
  let t=`*CUADRE DEL DÍA*\nEfectivo total: ${q(efvDia)}\n`;
  if(credDia>0)t+=`Crédito total: ${q(credDia)}\n`;
  t+='\n'+lineas.join('\n');
  navigator.clipboard.writeText(t).then(()=>toast('Copiado ✓')).catch(()=>toast('No se pudo copiar',true));
}

// Recarga automática: solo si hay un cambio nuevo de OTRO dispositivo y no estoy escribiendo
async function recargarSiHaceFalta(){
  if(modoLectura)return;
  if(escribiendoAhora())return;       // no interrumpir si está escribiendo
  if(viajeAbierto!==null)return;      // hay un viaje abierto en edición, no tocar
  if(_autoOcupado)return;             // no encimar dos recargas
  // No recargar si hay un viaje preparando (anotando, aún sin enviar): se perdería lo que se escribe
  if(viajes.some(v=>v && !v.entradaLista && !v.cerrado))return;
  let remoto=null;
  try{
    const{data}=await sb.from('dias').select('actualizado_en').eq('fecha',HOY).maybeSingle();
    remoto=data?data.actualizado_en:null;
  }catch(e){return;}
  if(!remoto||remoto===miUltimoGuardado||remoto===_ultimoVisto)return; // nada nuevo
  _autoOcupado=true;
  _ultimoVisto=remoto;
  const sel=selRutero, va=viajeAbierto;
  _cargando=true;
  try{
    const{data}=await sb.from('dias').select('estado').eq('fecha',HOY).maybeSingle();
    if(data&&data.estado){
      const e=data.estado;
      unirRuteros(ruteros, e.ruteros);
      viajes=combinarViajes(viajes, e.viajes);
      const claves=new Set(auditoria.map(a=>a.hora+'|'+a.accion+'|'+(a.detalle||'')));
      (e.auditoria||[]).forEach(a=>{const k=a.hora+'|'+a.accion+'|'+(a.detalle||'');if(!claves.has(k))auditoria.push(a);});
      auditoria.sort((a,b)=>new Date(b.hora)-new Date(a.hora));
    }
  }catch(e){console.log('auto-recarga err',e);}
  _cargando=false;
  selRutero=sel&&ruteros.includes(sel)?sel:(ruteros[0]||null);
  if(vistaDetalle&&selRutero!==sel)vistaDetalle=false;
  viajeAbierto=va;
  renderRuteros();renderZona();
  _autoOcupado=false;
}
// Recarga FORZADA (botón actualizar): trae lo último ya mismo
async function actualizarYa(){
  const b=document.getElementById('btnActualizar'); if(b)b.classList.add('girando');
  const sel=selRutero, va=viajeAbierto;
  _cargando=true;
  // Combinar lo de la nube con lo mío (no perder lo que anoté sin subir)
  try{
    const{data}=await sb.from('dias').select('estado').eq('fecha',HOY).maybeSingle();
    if(data&&data.estado){
      const e=data.estado;
      unirRuteros(ruteros, e.ruteros);
      viajes=combinarViajes(viajes, e.viajes);
      const claves=new Set(auditoria.map(a=>a.hora+'|'+a.accion+'|'+(a.detalle||'')));
      (e.auditoria||[]).forEach(a=>{const k=a.hora+'|'+a.accion+'|'+(a.detalle||'');if(!claves.has(k))auditoria.push(a);});
      auditoria.sort((a,b)=>new Date(b.hora)-new Date(a.hora));
    }
  }catch(e){console.log('actualizar err',e);toast('⚠ Sin internet',true);}
  _cargando=false;
  selRutero=sel&&ruteros.includes(sel)?sel:(ruteros[0]||null);
  if(vistaDetalle&&selRutero!==sel)vistaDetalle=false;
  viajeAbierto=va;
  renderRuteros();renderZona();
  if(b)setTimeout(()=>b.classList.remove('girando'),500);
  toast('Actualizado ✓');
}

// ===== HISTORIAL: ver un día anterior en solo lectura =====
async function verDia(fecha){
  if(!fecha)return;
  if(fecha===HOY){volverHoy();return;}
  try{
    const{data}=await sb.from('dias').select('estado').eq('fecha',fecha).maybeSingle();
    if(!data||!data.estado){toast('No hay datos de ese día',true);return;}
    modoLectura=true;
    const e=data.estado;
    _cargando=true;
    ruteros=e.ruteros||[];viajes=e.viajes||[];auditoria=e.auditoria||[];idv=e.idv||1;idp=e.idp||1;
    viajes.forEach(v=>{if(v&&!v.uid)v.uid=uid();});
    selRutero=ruteros[0]||null;viajeAbierto=null;vistaDetalle=false;
    _cargando=false;
    renderRuteros();renderZona();
    mostrarBannerHistorial(fecha);
    window.scrollTo({top:0,behavior:'smooth'});
  }catch(err){toast('No se pudo cargar ese día',true);console.log(err);}
}
async function volverHoy(){
  modoLectura=false;
  document.getElementById('bannerHist').style.display='none';
  _cargando=true;
  await cargarNube();
  selRutero=ruteros[0]||null;viajeAbierto=null;vistaDetalle=false;
  _cargando=false;
  renderRuteros();renderZona();
  window.scrollTo({top:0,behavior:'smooth'});
}
function mostrarBannerHistorial(fecha){
  const b=document.getElementById('bannerHist');
  const f=new Date(fecha+'T12:00:00').toLocaleDateString('es-GT',{weekday:'long',day:'numeric',month:'long'});
  b.innerHTML=`📅 Viendo: <b>${f}</b> (solo lectura) · <span onclick="volverHoy()" style="text-decoration:underline;cursor:pointer">Volver a hoy</span>`;
  b.style.display='block';
}

// ===== VERSIÓN Y ACTUALIZACIÓN AUTOMÁTICA =====
// Cambiar VERSION en cada cambio que se publique. La app compara la suya con
// la publicada: si hay una nueva, se actualiza sola al volver a abrirla (si
// no hay nada a medias) o muestra un aviso para tocar y actualizar.
// Importante con varios aparatos: todos deben correr la misma versión.
const VERSION='2026-10-02.1';
async function versionPublicada(){
  try{
    const r=await fetch(location.pathname+'?nv='+Date.now(),{cache:'no-store'});
    if(!r.ok)return null;
    const m=(await r.text()).match(/const VERSION='([^']+)'/);
    return m?m[1]:null;
  }catch(e){return null;}
}
function hayAlgoAMedias(){
  const abierto=id=>{const e=document.getElementById(id);return !!(e&&e.classList.contains('open'));};
  return document.body.classList.contains('anotando')||abierto('modalRecibe')||abierto('overlay')
    ||escribiendoAhora()||_fabAbierto
    ||viajes.some(v=>v&&!v.entradaLista&&!v.cerrado&&(v.pedidos||[]).length>0);
}
function recargarApp(){location.replace(location.pathname+'?v='+Date.now());}
async function revisarVersion(puedeRecargar){
  const nv=await versionPublicada();
  if(!nv||nv===VERSION)return;
  // Para no quedar en un ciclo: se intenta recargar solo una vez por versión
  const k='cc_intento_'+nv;let ya=false;
  try{ya=!!sessionStorage.getItem(k);}catch(e){}
  if(puedeRecargar&&!ya&&!hayAlgoAMedias()){
    try{sessionStorage.setItem(k,'1');}catch(e){}
    recargarApp();return;
  }
  const a=document.getElementById('avisoVersion');if(a)a.style.display='block';
}

let _initDone=false;
async function iniciar(){
  try{ await cargarNube(); }catch(e){ console.log('init carga falló',e); }
  if(!selRutero&&ruteros.length)selRutero=ruteros[0];
  _cargando=false; _initDone=true;
  renderRuteros();renderZona();
  // Auto-actualización: revisa la nube cada 30s y baja cambios SOLO si hay algo
  // nuevo de otro teléfono y no estás escribiendo. Nunca pisa tu trabajo.
  // Auto-actualización cada 5 minutos. Solo baja cambios de otros teléfonos
  // si no estás escribiendo ni tenés un viaje en proceso. Nunca interrumpe.
  setInterval(recargarSiHaceFalta,300000);
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',ajustarBarraTeclado);
    window.visualViewport.addEventListener('scroll',ajustarBarraTeclado);
  }
  // Versión: mostrarla, y revisar si hay una nueva al abrir, al volver a la
  // app (por ejemplo al regresar del cambiador de apps) y cada 3 minutos.
  const ve=document.getElementById('verApp');if(ve)ve.textContent='v'+VERSION;
  setTimeout(()=>revisarVersion(true),4000);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')revisarVersion(true);});
  setInterval(()=>revisarVersion(false),180000);
}
