</style>

// ---------- conexión ----------
async function rpc(fn, args) {
  let r;
  try {
    r = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify(args || {})
    });
  } catch (e) { const x = new Error('Sin internet'); x.offline = true; throw x; }
  const txt = await r.text(); let j = null;
  try { j = txt ? JSON.parse(txt) : null; } catch (e) {}
  if (!r.ok) {
    const m = (j && j.message) || ('Error ' + r.status);
    const x = new Error(m);
    if (m === 'SESION') x.sesion = true;
    if (r.status >= 500 || r.status === 408 || r.status === 429) x.offline = true;
    throw x;
  }
  return j;
}

async function enviarCola() {
  if (!S.ses || !S.ses.token) return false;
  if (S.enviando) return false;
  S.enviando = true;
  try {
    let c = cola();
    while (c.length) {
      const op = c[0];
      try { await rpc(op.fn, Object.assign({ p_token: S.ses.token }, op.args)); }
      catch (e) {
        if (e.offline) { S.online = false; return false; }
        if (e.sesion) { sesionVencida(); return false; }
        S.aviso = 'No se pudo guardar: ' + e.message;
      }
      c = cola(); c.shift(); LS.set(keyCola(), c);
    }
    S.online = true;
    return true;
  } finally { S.enviando = false; }
}

let _sincronizando = false;
async function sync() {
  if (!S.ses || !S.ses.token || _sincronizando) return;
  _sincronizando = true;
  try {
    const ok = await enviarCola();
    if (!ok) { pintarCab(); return; }
    const t = tk();
    const d = await rpc('ce_datos', { p_token: S.ses.token, p_tienda: t });
    if (cola().length) { setTimeout(sync, 400); return; }       // anotaron algo mientras tanto
    if (t !== tk()) return;
    S.online = true;
    const antes = JSON.stringify(LS.get(keyDatos(t), null));
    LS.set(keyDatos(t), d);
    if (d && d.yo) { S.ses.nombre = d.yo.nombre; LS.set('ce_sesion', S.ses); }
    if ((S.view === 'home' || S.view === 'reporte') && antes !== JSON.stringify(d)) render(); else pintarCab();
  } catch (e) {
    if (e.sesion) sesionVencida();
    else if (e.offline) { S.online = false; pintarCab(); }
  } finally { _sincronizando = false; }
}

function sesionVencida() {
  if (S.ses) { S.ultUsuario = S.ses.usuario; LS.set('ce_ult_usuario', S.ultUsuario); }
  S.ses = null; LS.del('ce_sesion');
  S.view = 'login'; S.f = { usuario: S.ultUsuario }; S.err = 'Tu sesión se cerró. Vuelve a entrar.';
  render();
}

// ---------- cálculos ----------
function balanceAl(d, t) {
  const fi = d.tienda.fecha_ini;
  const ing = d.ingresos.filter(i => i.fecha >= fi && i.fecha <= t).reduce((a, i) => a + Number(i.monto), 0);
  const rec = d.entregas.filter(e => e.estado === 'recibido' && e.fecha_recibido && e.fecha_recibido >= fi && e.fecha_recibido <= t).reduce((a, e) => a + Number(e.total), 0);
  return n2(Number(d.tienda.saldo_ini) + ing - rec);
}
const ventasDeRec = (d, eid) => ventasDe(d, eid).slice().reverse();   // para las listas: el día más reciente arriba
const ventasDe = (d, eid) => d.ventas.filter(v => v.entrega_id === eid).sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
const diasCortoDe = (d, eid) => ventasDe(d, eid).map(v => diaCorto(v.fecha)).join(', ');
// Resumen de los días de una entrega: "Mar 17 – Vie 20". Si en medio falta un día, se dice cuál
// (pendiente, o descanso / cerrado si administración lo marcó). Los días con venta en otra entrega no se mencionan.
function rangoDe(d, eid) {
  const fs = [...new Set(ventasDe(d, eid).map(v => v.fecha))].sort();
  if (!fs.length) return '';
  const a = fs[0], b = fs[fs.length - 1];
  let txt = a === b ? diaCorto(a) : diaCorto(a) + ' – ' + diaCorto(b);
  const conVenta = new Set(d.ventas.map(v => v.fecha)); const marcas = {}; (d.dias || []).forEach(x => { marcas[x.fecha] = x.motivo; });
  const huecos = [];
  for (let x = addDays(a, 1); x < b; x = addDays(x, 1)) {
    if (fs.includes(x) || conVenta.has(x)) continue;
    huecos.push(marcas[x] ? `${diaCorto(x)} ${marcas[x]}` : `<span class="hueco">${diaCorto(x)} pendiente</span>`);
  }
  return txt + (huecos.length ? ' · ' + huecos.join(', ') : '');
}
// Venta anotada otro día (no el mismo día de la venta): marca roja en administración.
// Se ve mientras el dinero está pendiente y 2 días después de recibirlo; luego se quita.
const esTarde = v => !!(v.creado_en && diaDe(v.creado_en) > v.fecha);
const tardeVigente = e => e.estado !== 'recibido' || !!(e.fecha_recibido && e.fecha_recibido >= addDays(hoyGT(), -2));
const diasTarde = v => { const a = diaDe(v.creado_en).split('-').map(Number), b = v.fecha.split('-').map(Number);
  return Math.round((Date.UTC(a[0], a[1] - 1, a[2]) - Date.UTC(b[0], b[1] - 1, b[2])) / 864e5); };
const tg = v => `<span class="tg" title="Anotado ${diasTarde(v)} día(s) después">${diasTarde(v)}D</span>`;
const diaMarca = (v, ok) => ok && esTarde(v) ? `<span class="tarde">${dia(v.fecha)}</span>${tg(v)}` : dia(v.fecha);
const diasCortoMarca = (d, eid, ok) => ventasDe(d, eid).map(v => ok && esTarde(v) ? `<span class="tarde">${diaCorto(v.fecha)}</span>${tg(v)}` : diaCorto(v.fecha)).join(', ');
// Correcciones de una venta, juntas: el monto que tenía al anotarla y quién la cambió por última vez
const correccionesDe = (d, v) => (d.cambios || []).filter(c => c.tipo === 'correccion' && c.venta_id === v.id).sort((a, b) => a.id - b.id);
const tc = (d, v) => correccionesDe(d, v).length ? '<span class="tc">Corrigió</span>' : '';
const RELOJ = '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="vertical-align:-1px"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>';
const horaAnot = v => { if (!v.creado_en) return ''; const da = diaDe(v.creado_en); return (da === v.fecha ? '' : fcorta(da) + ' · ') + horaDe(v.creado_en); };
const horaTag = v => { const h = horaAnot(v); return h ? `<span class="hora" aria-label="Hora en que se anotó">${RELOJ}${h}</span>` : ''; };
// Línea de abajo en administración: a qué hora la anotaron y, si la cambiaron, el monto de antes
const lineaAdm = (d, v) => { const cs = correccionesDe(d, v); const h = horaAnot(v);
  const partes = []; if (h) partes.push(RELOJ + ' ' + h);
  if (cs.length) { partes.push('Antes ' + fmt(cs[0].antes)); if (cs.length > 1) partes.push(cs.length + ' cambios'); }
  return partes.length ? `<span class="t2">${partes.join(' · ')}</span>` : ''; };
const corrLinea = (d, v) => { const cs = correccionesDe(d, v); if (!cs.length) return '';
  const u = cs[cs.length - 1]; return `<span class="t2">Antes ${fmt(cs[0].antes)} · ${esc(u.quien)} ${horaDe(u.cuando)}${cs.length > 1 ? ' · ' + cs.length + ' cambios' : ''}</span>`; };
const corrLineaTienda = (d, v) => { const cs = correccionesDe(d, v); if (!cs.length) return '';
  return `<span class="t2">Antes ${fmt(cs[0].antes)} · ${horaDe(cs[cs.length - 1].cuando)}</span>`; };
const recientePrimero = k => (a, b) => (a[k] < b[k] ? 1 : a[k] > b[k] ? -1 : (a.creado_en < b.creado_en ? 1 : a.creado_en > b.creado_en ? -1 : 0));

// Gráfica de la semana (lunes a domingo): venta de cada día contra la meta diaria.
// Sin números: la línea, una guía punteada en la meta y una palabra (Bien / Regular / Bajo).
function graficaSemana(d) {
  // Sin palabras: cada día es un punto de color (verde = llegó a la meta, ámbar = cerca, coral = abajo)
  // y la línea va cambiando de color de un día al otro. La meta es la línea punteada.
  const meta = Number(d.tienda.meta || 600); const hoy = hoyGT();
  const lunes = addDays(hoy, -((dow(hoy) + 6) % 7));
  const porDia = {}; d.ventas.forEach(v => { porDia[v.fecha] = (porDia[v.fecha] || 0) + Number(v.monto); });
  const marcas = new Set((d.dias || []).map(x => x.fecha));
  const desdeUso = d.ventas.reduce((m, v) => v.fecha < m ? v.fecha : m, hoy);
  const dias = []; for (let i = 0; i < 7; i++) {
    const f = addDays(lunes, i); let val = null;
    if (porDia[f] != null) val = porDia[f];
    else if (f < hoy && f >= desdeUso && !marcas.has(f)) val = 0;   // día pasado sin venta anotada
    dias.push({ f, val, hoy: f === hoy });
  }
  const col = v => v >= meta ? '#2E8A5E' : v >= meta * .8 ? '#D69A2D' : '#E07160';
  const W = 300, H = 30, pad = 4, x = i => pad + i * (W - 2 * pad) / 6;
  const max = Math.max(meta * 1.35, ...dias.filter(p => p.val !== null).map(p => p.val), 1);
  const y = v => H - pad - (v / max) * (H - 2 * pad);
  const uid = Math.random().toString(36).slice(2, 7);
  const tramos = [], grads = [];
  for (let i = 0; i < 6; i++) {
    const a = dias[i], b = dias[i + 1]; if (a.val === null || b.val === null) continue;
    const id = `s${uid}${i}`;
    grads.push(`<linearGradient id="${id}" gradientUnits="userSpaceOnUse" x1="${x(i)}" y1="0" x2="${x(i + 1)}" y2="0"><stop offset="0" stop-color="${col(a.val)}"/><stop offset="1" stop-color="${col(b.val)}"/></linearGradient>`);
    tramos.push(`<line x1="${x(i).toFixed(1)}" y1="${y(a.val).toFixed(1)}" x2="${x(i + 1).toFixed(1)}" y2="${y(b.val).toFixed(1)}" stroke="url(#${id})" stroke-width="2" stroke-linecap="round"/>`);
  }
  const letras = ['L', 'M', 'M', 'J', 'V', 'S', 'D'];
  return `<div class="sem7"><svg viewBox="0 0 ${W} ${H + 12}" role="img" aria-label="Ventas de esta semana contra la meta">
      <defs>${grads.join('')}</defs>
      <line x1="${pad}" x2="${W - pad}" y1="${y(meta).toFixed(1)}" y2="${y(meta).toFixed(1)}" stroke="currentColor" stroke-opacity=".22" stroke-width="1" stroke-dasharray="3 4"/>
      ${tramos.join('')}
      ${dias.map((p, i) => p.val === null ? '' : `<circle cx="${x(i).toFixed(1)}" cy="${y(p.val).toFixed(1)}" r="${p.hoy ? 3.6 : 3}" fill="${col(p.val)}" stroke="#FFF" stroke-width="1.2"/>`).join('')}
      ${letras.map((l, i) => `<text x="${x(i).toFixed(1)}" y="${H + 10}" text-anchor="middle" font-size="8" font-weight="${dias[i].hoy ? 700 : 500}" fill="currentColor" fill-opacity="${dias[i].hoy ? .85 : .45}">${l}</text>`).join('')}
    </svg>
    <div class="ley7" aria-hidden="true"><span><i style="background:#2E8A5E"></i>Bien</span><span><i style="background:#D69A2D"></i>Regular</span><span><i style="background:#E07160"></i>Bajo</span></div></div>`;
}
function tarjetaBalance(d, chico) {
  const saldo = balanceAl(d, '9999-12-31'); const alto = saldo > Number(d.tienda.tope);
  return `<section class="bal ${alto ? 'alto' : 'ok'} ${chico ? 'chico' : ''}">
    <div class="hrow"><span class="lab">Balance de la tienda</span>${chico ? '' : `<button class="ver" data-a="reporte" aria-label="Ver reporte">${ICO.ojo}Ver</button>`}</div>
    <div class="fila2"><span class="monto">${fmt(saldo)}</span>
      <span class="lado"><span class="est"><span class="dot"></span>${alto ? 'Sobre el tope' : 'Normal'}</span><span>Tope ${fmt(d.tienda.tope)}</span></span></div>
    ${S.flash ? `<span class="flash" role="status">${esc(S.flash)}</span>` : ''}
    ${graficaSemana(d)}

}

      : '<p class="vacio">Todavía no hay facturas.</p>'}${masBtn('ing', ings.length)}</div></section>`;

function vistaAdmin() {
  const d = D(); if (!d) return cargando();
  const pend = d.entregas.filter(e => e.estado === 'enviado').sort(recientePrimero('fecha_envio'));
  const movs = d.ingresos.map(i => ({ tipo: 'ing', id: i.id, fecha: i.fecha, creado_en: i.creado_en, o: i }))
    .concat(d.entregas.filter(e => e.estado === 'recibido').map(e => ({ tipo: 'rec', id: e.id, fecha: e.fecha_recibido, creado_en: e.creado_en, o: e })))
    .concat((d.dias || []).filter(x => !d.ventas.some(v => v.fecha === x.fecha)).map(x => ({ tipo: 'dia', id: 'dia-' + x.fecha, fecha: x.fecha, creado_en: '', o: x })))
    .sort(recientePrimero('fecha'))
    .filter(m => S.movF === 'efectivo' ? m.tipo === 'rec' : S.movF === 'merc' ? m.tipo === 'ing' : true);
  const hoy = hoyGT();
  const sin = d.ventas.filter(v => !v.entrega_id).sort(recientePrimero('fecha'));
  // Días sin ninguna venta anotada (desde que empezó a usar la app): salen con la fecha y guiones
  const conVenta = new Set(d.ventas.map(v => v.fecha));
  const primera = d.ventas.reduce((m, v) => v.fecha < m ? v.fecha : m, hoy);
  let desdeV = d.tienda.fecha_ini > primera ? d.tienda.fecha_ini : primera;
  if (desdeV < addDays(hoy, -30)) desdeV = addDays(hoy, -30);
  const marcas = {}; (d.dias || []).forEach(x => { marcas[x.fecha] = x; });
  const vacios = [], marcados = [];
  for (let x = hoy; x >= desdeV; x = addDays(x, -1)) if (!conVenta.has(x)) (marcas[x] ? marcados.push({ marcado: marcas[x], fecha: x }) : vacios.push({ vacio: true, fecha: x }));

// ---------- reporte ----------
function reporte(d) {
  let desde = S.rDesde, hasta = S.rHasta;
  if (!desde || !hasta) return null;
  if (desde > hasta) { const t = desde; desde = hasta; hasta = t; }
  const fi = d.tienda.fecha_ini;
  if (desde < fi) desde = fi;
  if (hasta < desde) hasta = desde;
  const en = f => f && f >= desde && f <= hasta;
  const ingP = d.ingresos.filter(i => en(i.fecha)).sort((a, b) => a.fecha < b.fecha ? -1 : 1);
  const recP = d.entregas.filter(e => e.estado === 'recibido' && en(e.fecha_recibido)).sort((a, b) => a.fecha_recibido < b.fecha_recibido ? -1 : 1);
  const merc = n2(ingP.reduce((a, i) => a + Number(i.monto), 0));
  const efec = n2(recP.reduce((a, e) => a + Number(e.total), 0));
  const vent = n2(d.ventas.filter(v => en(v.fecha)).reduce((a, v) => a + Number(v.monto), 0));
  const ini = balanceAl(d, addDays(desde, -1)), fin = balanceAl(d, hasta);
  let diasTope = 0; for (let x = desde; x <= hasta; x = addDays(x, 1)) if (balanceAl(d, x) > Number(d.tienda.tope)) diasTope++;
  const semanas = []; let w = addDays(desde, -((dow(desde) + 6) % 7));
  while (w <= hasta) {
    const a = w < desde ? desde : w; const fw = addDays(w, 6); const b = fw > hasta ? hasta : fw;
    const m = n2(d.ingresos.filter(i => i.fecha >= a && i.fecha <= b).reduce((s, i) => s + Number(i.monto), 0));
    const e = n2(d.entregas.filter(x => x.estado === 'recibido' && x.fecha_recibido >= a && x.fecha_recibido <= b).reduce((s, x) => s + Number(x.total), 0));
    semanas.push({ a, b, m, e }); w = addDays(w, 7);
  }
  const cams = d.cambios || [];
  const enC = c => en(diaDe(c.cuando));
  const cob = merc > 0 ? efec / merc * 100 : null;
  return { desde, hasta, ingP, recP, merc, efec, vent, ini, fin, diasTope, semanas: semanas.reverse(), cob,
    corr: cams.filter(c => c.tipo === 'correccion' && enC(c)).length, tarde: cams.filter(c => c.tipo === 'tarde' && enC(c)).length };
}

  if (r.recP.length) fila('Total', fmt(r.efec), { bold: true });
  const np = doc.getNumberOfPages();
  for (let i = 1; i <= np; i++) { doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); color(gris); doc.text('Control de Efectivo · Distribuidora Hernández · Página ' + i + ' de ' + np, W / 2, 770, { align: 'center' }); }
  const nombre = 'Reporte ' + d.tienda.nombre + ' ' + fdate(r.desde).replace(/\//g, '-') + ' a ' + fdate(r.hasta).replace(/\//g, '-') + '.pdf';
  const blob = doc.output('blob');
  try { const file = new File([blob], nombre, { type: 'application/pdf' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Reporte de efectivo' }); return; } }
  catch (e) { if (e && e.name === 'AbortError') return; }
  doc.save(nombre);
}

// ---------- usuarios (administración) ----------

    ${errHtml()}${botones('guardarUsuario', 'Guardar', 'n').replace('data-a="home"', 'data-a="usuarios"')}</div>`;

async function cargarUsuarios() {

}

async function revisarAdmin() {

}
async function trasEntrar(r) {

  LS.set('ce_sesion', S.ses); S.ultUsuario = r.usuario; LS.set('ce_ult_usuario', r.usuario);

// ---------- acciones ----------
function abrir(view, f) { S.view = view; S.f = f || {}; S.err = ''; S.swiped = null; render(); window.scrollTo(0, 0); }
const A = {
  home() { abrir('home'); sync(); },
  salir() {
    const n = cola().length;
    if (n && !confirm('Hay ' + n + ' registro(s) sin enviar. Si sales ahora se pierden. ¿Salir de todos modos?')) return;
    if (!n && !confirm('¿Salir de la app?')) return;
    const tok = S.ses && S.ses.token;
    if (tok) rpc('ce_salir', { p_token: tok }).catch(() => {});
    if (S.ses) { LS.del(keyCola()); Object.keys(localStorage).filter(k => k.startsWith('ce_datos_' + S.ses.usuario + '_')).forEach(k => LS.del(k)); }
    S.ses = null; LS.del('ce_sesion'); S.view = 'login'; S.f = { usuario: S.ultUsuario }; S.err = ''; render(); revisarAdmin();
  },
  tienda(el) { S.tienda = el.dataset.id; LS.set('ce_tienda_admin', S.tienda); S.lim = Object.assign({}, LIM0); S.swiped = null; render(); sync(); },
  quitarAviso() { S.aviso = ''; render(); },
  preview() { S.preview = true; S.swiped = null; S.lim = Object.assign({}, LIM0); render(); window.scrollTo(0, 0); },
  cerrarPreview() { S.preview = false; S.lim = Object.assign({}, LIM0); render(); window.scrollTo(0, 0); },
  mas(el) { S.lim[el.dataset.k] += 5; render(); },
  movF(el) { S.movF = el.dataset.k; S.lim.mov = LIM0.mov; S.swiped = null; render(); },
  abrir(el) { const id = el.dataset.id; S.abiertos[id] = !S.abiertos[id]; S.swiped = null; render(); },
  reporte() { if (!S.rDesde) ponerPeriodo('60'); S.flash = ''; abrir('reporte'); },
  per(el) { ponerPeriodo(el.dataset.p); render(); },
  pdf() { hacerPdf(); },
  usuarios() { S.usuarios = null; abrir('usuarios'); cargarUsuarios(); },
  usuario(el) {
    const id = el.dataset.id; const d = D();
    if (!id) return abrir('usuario', { id: null, nombre: '', usuario: '', pass: '', tienda: S.tienda || ((d && d.tiendas && d.tiendas[0] || {}).id), activo: true, rol: 'tienda' });
    const u = (S.usuarios || []).find(x => x.id === id); if (!u) return;
    abrir('usuario', { id: u.id, nombre: u.nombre, usuario: u.usuario, pass: '', tienda: u.tienda_id, activo: u.activo, rol: u.rol });
  },
  async guardarUsuario() {
    const f = S.f; const b = $('[data-a="guardarUsuario"]'); if (b) b.disabled = true;
    try {
      await rpc('ce_guardar_usuario', { p_token: S.ses.token, p_id: f.id || null, p_usuario: f.usuario, p_nombre: f.nombre, p_pass: f.pass || '',
        p_tienda: f.rol === 'admin' ? null : f.tienda, p_activo: f.rol === 'admin' ? true : !!f.activo });
      S.usuarios = null; abrir('usuarios'); cargarUsuarios();
    } catch (e) {
      if (e.sesion) return sesionVencida();
      S.err = e.offline ? 'Necesitas internet para guardar usuarios.' : e.message; render();
    }
  },
  async entrar() {
    const f = S.f; S.err = '';
    if (!f.usuario || !f.pass) { S.err = 'Escribe tu usuario y contraseña.'; return render(); }
    const b = $('#btnEntrar'); if (b) { b.disabled = true; b.textContent = 'Entrando…'; }
    try {
      const r = await rpc('ce_login', { p_usuario: f.usuario, p_pass: f.pass });
      if (r && r.error) { S.err = r.error; return render(); }
      trasEntrar(r);
    } catch (e) { S.err = e.offline ? 'Necesitas internet para entrar la primera vez.' : e.message; render(); }
  },
  async crearAdmin() {
    const f = S.f; S.err = '';
    if (!f.usuario || !f.pass) { S.err = 'Escribe usuario y contraseña.'; return render(); }
    if (f.pass !== f.pass2) { S.err = 'Las contraseñas no son iguales.'; return render(); }
    const b = $('#btnEntrar'); if (b) b.disabled = true;
    try { trasEntrar(await rpc('ce_crear_admin', { p_usuario: f.usuario, p_nombre: f.nombre || '', p_pass: f.pass })); }
    catch (e) { S.err = e.offline ? 'Necesitas internet.' : e.message; render(); }
  },

  // tienda
  venta() { abrir('venta', { fecha: hoyGT(), monto: '' }); },
  guardarVenta() {
    const d = D(); const f = S.f; const m = n2(num(f.monto)); const hoy = hoyGT();
    if (!d) return;
    if (!f.fecha) { S.err = 'Escoge el día.'; return render(); }
    if (f.fecha > hoy) { S.err = 'No se puede anotar un día que todavía no pasa.'; return render(); }
    if (!(m > 0)) { S.err = 'Escribe un monto mayor a 0.'; return render(); }
    const id = uuid(), ahora = new Date().toISOString();
    d.ventas.push({ id, fecha: f.fecha, monto: m, quien: S.ses.nombre || S.ses.usuario, entrega_id: null, creado_en: ahora }); setD(d);
    encolar('ce_venta', { p_id: id, p_fecha: f.fecha, p_monto: m, p_creado: ahora });
    avisar('Venta anotada · ' + fmt(m)); abrir('home'); sync();
  },
  corregir(el) { const d = D(); const v = d && d.ventas.find(x => x.id === el.dataset.id); if (!v) return; abrir('corregir', { id: v.id, monto: fmtInput(String(v.monto)) }); },
  guardarCorreccion() {
    const d = D(); const v = d && d.ventas.find(x => x.id === S.f.id); const m = n2(num(S.f.monto));
    if (!v) return;
    if (v.entrega_id || v.fecha !== hoyGT()) { S.err = 'Solo se pueden corregir las ventas de hoy.'; return render(); }
    if (!(m > 0)) { S.err = 'Escribe un monto mayor a 0.'; return render(); }
    if (m === Number(v.monto)) return abrir('home');
    const ahoraC = new Date().toISOString();
    d.cambios = d.cambios || [];
    d.cambios.push({ id: Date.now(), tipo: 'correccion', venta_id: v.id, fecha: v.fecha, antes: Number(v.monto), despues: m, quien: S.ses.nombre || S.ses.usuario, cuando: ahoraC });
    v.monto = m; setD(d);
    encolar('ce_corregir', { p_venta: v.id, p_monto: m, p_creado: new Date().toISOString() });
    avisar('Venta corregida · ' + fmt(m)); abrir('home'); sync();
  },
  entrega() { abrir('entrega', { sel: {} }); },
  guardarEntrega() {
    const d = D(); if (!d) return;
    const vs = d.ventas.filter(v => !v.entrega_id && S.f.sel[v.id]);
    if (!vs.length) { S.err = 'Marca al menos una venta.'; return render(); }
    const id = uuid(), ahora = new Date().toISOString(), total = n2(vs.reduce((a, v) => a + Number(v.monto), 0));
    vs.forEach(v => { v.entrega_id = id; });
    d.entregas.push({ id, fecha_envio: hoyGT(), total, quien: S.ses.nombre || S.ses.usuario, estado: 'enviado', fecha_recibido: null, creado_en: ahora }); setD(d);
    encolar('ce_entregar', { p_id: id, p_ventas: vs.map(v => v.id), p_creado: ahora });
    avisar('Entrega enviada · ' + fmt(total)); abrir('home'); sync();
  },

  // administración
  aceptar(el) {
    const d = D(); const e = d && d.entregas.find(x => x.id === el.dataset.id); if (!e) return;
    e.estado = 'recibido'; e.fecha_recibido = hoyGT(); setD(d);
    encolar('ce_aceptar', { p_entrega: e.id });
    avisar('Recibido · −' + fmt(e.total)); render(); sync();
  },
  devolver(el) {
    const d = D(); const e = d && d.entregas.find(x => x.id === el.dataset.id); if (!e || e.estado !== 'enviado') return;
    if (!confirm('¿Devolver esta entrega de ' + fmt(e.total) + '? Las ventas regresan a "sin entregar" en la tienda, como si no la hubieran enviado.')) return;
    d.ventas.forEach(v => { if (v.entrega_id === e.id) v.entrega_id = null; });
    d.entregas = d.entregas.filter(x => x.id !== e.id); setD(d);
    encolar('ce_devolver', { p_entrega: e.id });
    avisar('Entrega devuelta a la tienda'); render(); sync();
  },
  ingreso() { abrir('ingreso', { id: null, factura: '', fecha: hoyGT(), monto: '' }); },
  editarIng(el) { const d = D(); const i = d && d.ingresos.find(x => x.id === el.dataset.id); if (!i) return; abrir('ingreso', { id: i.id, factura: i.factura, fecha: i.fecha, monto: fmtInput(String(i.monto)) }); },
  guardarIngreso() {
    const d = D(); const f = S.f; const m = n2(num(f.monto)); const fac = String(f.factura || '').trim();
    if (!d) return;
    if (!fac) { S.err = 'Escribe el número de factura.'; return render(); }
    if (!f.fecha) { S.err = 'Escoge la fecha.'; return render(); }
    if (!(m > 0)) { S.err = 'Escribe un monto mayor a 0.'; return render(); }
    const id = f.id || uuid();
    const ex = d.ingresos.find(x => x.id === id);
    if (ex) { ex.factura = fac; ex.fecha = f.fecha; ex.monto = m; } else d.ingresos.push({ id, factura: fac, fecha: f.fecha, monto: m, creado_en: new Date().toISOString() });
    setD(d);
    encolar('ce_ingreso', { p_tienda: tk(), p_id: id, p_factura: fac, p_fecha: f.fecha, p_monto: m });
    avisar(ex ? 'Factura ' + fac + ' editada · ' + fmt(m) : 'Ingreso nuevo · +' + fmt(m)); abrir('home'); sync();
  },
  dia(el) {
    const d = D(); if (!d) return; const fe = el.dataset.fecha; const x = (d.dias || []).find(y => y.fecha === fe);
    abrir('dia', { fecha: fe, motivo: x ? x.motivo : 'descanso', nota: x ? x.nota : '' });
  },
  motivo(el) { S.f.motivo = el.dataset.m; document.querySelectorAll('[data-a="motivo"]').forEach(b => b.classList.toggle('on', b === el)); },
  guardarDia() {
    const d = D(); const f = S.f; if (!d) return;
    const nota = String(f.nota || '').trim().slice(0, 200);
    d.dias = (d.dias || []).filter(x => x.fecha !== f.fecha).concat([{ fecha: f.fecha, motivo: f.motivo, nota }]); setD(d);
    encolar('ce_marcar_dia', { p_tienda: tk(), p_fecha: f.fecha, p_motivo: f.motivo, p_nota: nota });
    avisar(dia(f.fecha) + ' · ' + (f.motivo === 'descanso' ? 'Descanso' : 'Cerrado')); abrir('home'); sync();
  },
  quitarDia() {
    const d = D(); const f = S.f; if (!d) return;
    d.dias = (d.dias || []).filter(x => x.fecha !== f.fecha); setD(d);
    encolar('ce_marcar_dia', { p_tienda: tk(), p_fecha: f.fecha, p_motivo: '', p_nota: '' });
    avisar('Marca quitada · ' + dia(f.fecha)); abrir('home'); sync();
  },
  ajustes() { const d = D(); if (!d) return; abrir('ajustes', { saldo: fmtInput(String(d.tienda.saldo_ini)), fecha: d.tienda.fecha_ini, tope: fmtInput(String(d.tienda.tope)), meta: fmtInput(String(d.tienda.meta || 600)) }); },
  guardarAjustes() {
    const d = D(); const f = S.f; const s = num(f.saldo), t = num(f.tope), me = num(f.meta);
    if (!d) return;
    if (!(s >= 0)) { S.err = 'Escribe el saldo inicial.'; return render(); }
    if (!f.fecha) { S.err = 'Escoge la fecha.'; return render(); }
    if (!(t > 0)) { S.err = 'Escribe un tope mayor a 0.'; return render(); }
    if (!(me > 0)) { S.err = 'Escribe una meta mayor a 0.'; return render(); }
    d.tienda.saldo_ini = n2(s); d.tienda.fecha_ini = f.fecha; d.tienda.tope = n2(t); d.tienda.meta = n2(me); setD(d);
    encolar('ce_ajustes', { p_tienda: tk(), p_saldo: n2(s), p_fecha: f.fecha, p_tope: n2(t), p_meta: n2(me) });
    avisar('Saldo y tope guardados'); abrir('home'); sync();
  }
};

// ---------- render ----------
function render() {
  const app = $('#app');
  if (!S.ses) { app.innerHTML = vistaLogin(); return; }
  const v = {
    home: () => esAdmin() ? (S.preview ? vistaTienda(true) : vistaAdmin()) : vistaTienda(false), venta: vistaVenta, corregir: vistaCorregir, entrega: vistaEntrega,
    ingreso: vistaIngreso, ajustes: vistaAjustes, dia: vistaDia, reporte: vistaReporte, usuarios: vistaUsuarios, usuario: vistaUsuario
  }[S.view] || (() => '');
  const tema = esAdmin() && ['home', 'ingreso', 'ajustes', 'reporte', 'dia'].includes(S.view) ? TEMA[S.tienda] : null;
  app.className = tema ? 'marco' : ''; app.style.cssText = temaVars(tema);
  app.innerHTML = cabecera() + '<main>' + v() + '</main>';
}

// ---------- eventos ----------
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) {
    if (S.swiped && !e.target.closest('.sw')) { S.swiped = null; document.querySelectorAll('.sw.abierta').forEach(x => x.classList.remove('abierta')); }
    return;
  }
  if (el.disabled || el.getAttribute('aria-disabled') === 'true') return;
  const fn = A[el.dataset.a]; if (fn) { e.preventDefault(); fn(el); }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.f) {
    if (el.type === 'checkbox') S.f[el.dataset.f] = el.checked;
    else if (el.hasAttribute('data-dinero')) { const v = fmtInput(el.value); if (v !== el.value) el.value = v; S.f[el.dataset.f] = v; }
    else S.f[el.dataset.f] = el.value;
    if (S.view === 'venta' && el.dataset.f === 'fecha') { const n = $('#notaTarde'); if (n) n.hidden = !(el.value && el.value < hoyGT()); }
    if (S.err) { S.err = ''; const x = document.querySelector('.err'); if (x) x.remove(); }
  }
  if (el.dataset.sel) { S.f.sel = S.f.sel || {}; S.f.sel[el.dataset.sel] = el.checked; const t = $('#selTotal'); if (t) t.textContent = fmt(totalSel()); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.f && (el.type === 'checkbox' || el.tagName === 'SELECT' || el.type === 'date')) {
    S.f[el.dataset.f] = el.type === 'checkbox' ? el.checked : el.value;
    if (S.view === 'venta' && el.dataset.f === 'fecha') { const n = $('#notaTarde'); if (n) n.hidden = !(el.value && el.value < hoyGT()); }
  }
  if (el.dataset.r) { S[el.dataset.r] = el.value; render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('.login input')) { const b = $('#btnEntrar'); if (b) b.click(); }
});
// Deslizar una factura a la izquierda: aparece "Editar"
let _sx = null, _sid = null;
document.addEventListener('pointerdown', e => { const r = e.target.closest('[data-swipe]'); _sid = r ? r.dataset.swipe : null; _sx = e.clientX; });
document.addEventListener('pointerup', e => {
  if (!_sid) return; const dx = e.clientX - _sx; const id = _sid; _sid = null;
  if (dx < -35) S.swiped = id; else if (dx > 35 || (Math.abs(dx) < 6 && S.swiped === id)) S.swiped = null; else return;
  document.querySelectorAll('.sw').forEach(x => { const f = x.querySelector('[data-swipe]'); const on = f && f.dataset.swipe === S.swiped;
    x.classList.toggle('abierta', on); const b = x.querySelector('.accion'); if (b) b.tabIndex = on ? 0 : -1; });
});
document.addEventListener('pointercancel', () => { _sid = null; });

window.addEventListener('online', () => { S.online = true; sync(); });
window.addEventListener('offline', () => { S.online = false; pintarCab(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sync(); });
setInterval(() => { if (document.visibilityState === 'visible') sync(); }, 30000);

// Guardar la app en el celular para que abra sin internet
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

// Arranque
if (!S.ses) { S.view = 'login'; S.f = { usuario: S.ultUsuario }; revisarAdmin(); }
render();
sync();
</script>
